        ${a.type==='edit'?(a.changes||[]).map(ch=>`<span class="change-chip">🔄 ${esc(ch)}</span>`).join(''):''}
        ${a.type==='delete'?`<div style="font-size:12px;color:#64748b;margin-bottom:4px">Stok saat dihapus: <strong>${a.stockAtDelete} ${esc(a.unit)}</strong></div>`:''}
        ${a.type==='opname'?`<div style="font-size:12px;color:#64748b;margin-bottom:4px">${a.lot?`Lot <strong>${esc(a.lot)}</strong>: s`:'S'}tok sistem <strong>${a.systemStock} ${esc(a.unit)}</strong> disesuaikan ke stok fisik <strong>${a.actualStock} ${esc(a.unit)}</strong> dengan selisih <strong class="${diffClass(a.diff)}">${fmtDiff(a.diff)} ${esc(a.unit)}</strong></div>`:''}
        <div style="font-size:12px;color:#1e40af;font-weight:600;margin-top:6px">📋 Alasan: ${esc(a.reason)}</div>
        ${a.note?`<div class="hist-note">📝 ${esc(a.note)}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`;
};

// ── PENGATURAN ─────────────────────────────────────────────────
const pageSettings = () => `
  <div class="page-title">🛠️ Pengaturan</div>
  <div class="page-sub">Pengaturan umum serta master data kategori, satuan, dan tujuan / penerima</div>
  <div class="panel" style="margin-bottom:16px"><div class="panel-body" style="padding:12px 18px;background:#fefce8;border-radius:14px;color:#854d0e;font-size:13px">
    ⚠️ <strong>Catatan:</strong> Master data yang sedang dipakai di transaksi aktif tidak bisa dihapus.
  </div></div>
  <div class="panel"><div class="panel-head">⚙️ Pengaturan Umum</div><div class="panel-body">
    <div class="settings-grid">
      <div class="field"><label>Nama Perusahaan (untuk cetak)</label><input id="s_company" value="${escAttr(settings.companyName)}" placeholder="contoh: PT Maju Medika"></div>
      <div class="field"><label>Peringatan ED (hari sebelum)</label><input type="number" min="1" id="s_expdays" value="${settings.expWarnDays}"></div>
      <div class="field"><label>Ingatkan Backup Setiap (hari)</label><input type="number" min="0" id="s_backupdays" value="${settings.backupRemindDays}"><div class="item-sub">Isi 0 untuk mematikan pengingat</div></div>
    </div>
    <button class="btn-save" onclick="saveSettings()">Simpan Pengaturan</button>
    <div style="font-size:12px;color:#64748b;margin-top:12px">💾 ${lastBackupAt()?`Backup terakhir: ${new Date(lastBackupAt()).toLocaleString('id-ID')}`:'Belum pernah backup.'} Backup dibuat lewat tombol Export JSON / Export CSV di menu samping.</div>
  </div></div>
  <div class="three-col">
    ${masterList('Kategori Barang','📁',cats,'cat','Spare Part, Bahan Baku...')}
    ${masterList('Satuan Barang','📏',units,'unit','unit, kg, pcs, karton...')}
    ${masterList('Tujuan / Penerima','👤',getRecipientList(),'recipient','Produksi, Gudang Cabang, Budi...')}
  </div>`;

const saveSettings = () => {
  const company = document.getElementById('s_company').value.trim();
  const expDays = Number(document.getElementById('s_expdays').value);
  const bDays = Number(document.getElementById('s_backupdays').value);
  if (!Number.isInteger(expDays) || expDays<1) return toast('Peringatan ED minimal 1 hari!','err');
  if (!Number.isInteger(bDays) || bDays<0) return toast('Hari pengingat backup tidak valid!','err');
  settings = {...settings, companyName:company, expWarnDays:expDays, backupRemindDays:bDays};
  save(); toast('Pengaturan disimpan.'); render();
};

const masterList = (title, icon, arr, type, ph) => `
  <div class="panel"><div class="panel-head">${icon} ${title}</div><div class="panel-body">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="ml_${type}" placeholder="contoh: ${ph}" style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0" onkeydown="if(event.key==='Enter')addMaster('${type}')">
      <button class="btn-primary" style="width:auto;padding:9px 16px;margin:0" onclick="addMaster('${type}')">+ Tambah</button>
    </div>
    ${arr.length===0?'<div class="empty" style="padding:20px 0">Belum ada data. Tambahkan di atas.</div>':
    `<div class="tag-list">${arr.map((v,idx)=>`<div class="tag-item">${esc(v)}<button onclick="delMasterAt('${type}',${idx})" title="Hapus">✕</button></div>`).join('')}</div>`}
  </div></div>`;

const addMaster = type => {
  const el = document.getElementById(`ml_${type}`);
  const v  = el.value.trim(); if (!v) return;
  if (type==='cat') {
    if (cats.map(c=>c.toLowerCase()).includes(v.toLowerCase())) return toast('Kategori sudah ada!','warn');
    cats.push(v); toast(`Kategori "${v}" ditambahkan!`);
  } else if (type==='unit') {
    if (units.map(u=>u.toLowerCase()).includes(v.toLowerCase())) return toast('Satuan sudah ada!','warn');
    units.push(v); toast(`Satuan "${v}" ditambahkan!`);
  } else {
    if (getRecipientList().map(r=>r.toLowerCase()).includes(v.toLowerCase())) return toast('Tujuan / penerima sudah ada!','warn');
    recipients.push(v); recipients = uniqText(recipients); toast(`Tujuan / penerima "${v}" ditambahkan!`);
  }
  save(); render();
};

const delMasterAt = (type, idx) => {
  const arr = type==='cat' ? cats : type==='unit' ? units : getRecipientList();
  const v = arr[idx];
  if (v===undefined) return;
  if (type==='cat') {
    if (items.some(i=>i.category===v)) return toast(`Kategori "${v}" masih digunakan!`,'err');
    cats = cats.filter(c=>c!==v); toast(`Kategori "${v}" dihapus.`);
  } else if (type==='unit') {
    if (items.some(i=>i.unit===v)) return toast(`Satuan "${v}" masih digunakan!`,'err');
    units = units.filter(u=>u!==v); toast(`Satuan "${v}" dihapus.`);
  } else {
    if (outRec.some(tx=>tx.recipient===v)) return toast(`Tujuan / penerima "${v}" masih dipakai di transaksi!`,'err');
    recipients = recipients.filter(r=>r!==v); toast(`Tujuan / penerima "${v}" dihapus.`);
  }
  save(); render();
};

// ── Edit Modal ─────────────────────────────────────────────────
const openEdit = id => {
  const it = items.find(i=>i.id===id);
  if (!it) return;
  editId = id;
  document.getElementById('e_name').value    = it.name;
  document.getElementById('e_code').value    = it.code||'';
  document.getElementById('e_brand').value   = it.brand||'';
  document.getElementById('e_permit').value  = it.permitNo||'';
  document.getElementById('e_stock').value   = it.stock;
  document.getElementById('e_minstock').value= it.minStock;
  document.getElementById('e_price').value   = it.price||'';
  document.getElementById('e_reason').value  = '';
  document.getElementById('e_note').value    = '';
  // populate selects
  const catSel  = document.getElementById('e_cat');
  const unitSel = document.getElementById('e_unit');
  catSel.innerHTML  = cats.map(c=>`<option ${c===it.category?'selected':''}>${esc(c)}</option>`).join('');
  unitSel.innerHTML = units.map(u=>`<option ${u===it.unit?'selected':''}>${esc(u)}</option>`).join('');
  if (!cats.includes(it.category)) catSel.innerHTML += `<option selected>${esc(it.category)}</option>`;
  if (!units.includes(it.unit)) unitSel.innerHTML += `<option selected>${esc(it.unit)}</option>`;
  const lots = sortLots(it.lots||[]);
  document.getElementById('e_lots_wrap').style.display = lots.length ? 'block' : 'none';
  document.getElementById('e_lots').innerHTML = lots.map(l=>`
    <div class="lot-edit-row" data-lot="${escAttr(l.lot)}">
      <span>🏷️ <strong>${esc(l.lot)}</strong></span>
      <input type="date" value="${escAttr(l.exp)}">
      <span style="color:#64748b">${l.qty} ${esc(it.unit)}</span>
    </div>`).join('');
  document.getElementById('editModal').style.display='flex';
};
const closeEdit = () => { document.getElementById('editModal').style.display='none'; editId=null; };
const saveEdit  = () => {
  const name    = document.getElementById('e_name').value.trim();
  const code    = document.getElementById('e_code').value.trim();
  const brand   = document.getElementById('e_brand').value.trim();
  const permitNo= document.getElementById('e_permit').value.trim();
  const cat     = document.getElementById('e_cat').value;
  const unit    = document.getElementById('e_unit').value;
  const stock   = Number(document.getElementById('e_stock').value);
  const minStock= Number(document.getElementById('e_minstock').value);
  const price   = Number(document.getElementById('e_price').value)||0;
  const reason  = document.getElementById('e_reason').value.trim();
  const note    = document.getElementById('e_note').value.trim();
  if (!name)   return toast('Nama tidak boleh kosong!','err');
  if (!cat || !unit) return toast('Kategori dan satuan wajib diisi!','err');
  if (Number.isNaN(stock) || stock<0) return toast('Stok tidak boleh negatif!','err');
  if (Number.isNaN(minStock) || minStock<0) return toast('Min stok tidak boleh negatif!','err');
  if (price<0) return toast('Harga tidak boleh negatif!','err');
  const orig = items.find(i=>i.id===editId);
  if (code && items.some(i=>i.id!==editId && (i.code||'').toLowerCase()===code.toLowerCase())) return toast(`Kode barang "${code}" sudah dipakai barang lain!`,'err');
  if (stock < sumLots(orig)) return toast(`Stok tidak boleh lebih kecil dari total lot (${sumLots(orig)}). Koreksi jumlah per lot lewat Stok Opname.`,'err');
  if (!reason) return toast('Alasan perubahan wajib diisi!','err');
  const changes = [];
  if (orig.name!==name)         changes.push(`Nama: "${orig.name}" → "${name}"`);
  if ((orig.code||'')!==code)   changes.push(`Kode: "${orig.code||'-'}" → "${code||'-'}"`);
  if ((orig.brand||'')!==brand) changes.push(`Merek: "${orig.brand||'-'}" → "${brand||'-'}"`);
  if ((orig.permitNo||'')!==permitNo) changes.push(`Izin Edar: "${orig.permitNo||'-'}" → "${permitNo||'-'}"`);
  if (orig.category!==cat)      changes.push(`Kategori: "${orig.category}" → "${cat}"`);
  if (orig.stock!==stock)       changes.push(`Stok: ${orig.stock} → ${stock}`);
  if (orig.unit!==unit)         changes.push(`Satuan: "${orig.unit}" → "${unit}"`);
  if (orig.minStock!==minStock) changes.push(`Min Stok: ${orig.minStock} → ${minStock}`);
  if ((orig.price||0)!==price)  changes.push(`Harga: ${fmtRp(orig.price||0)} → ${fmtRp(price)}`);
  const newLots = (orig.lots||[]).map(l=>({...l}));
  document.querySelectorAll('#e_lots .lot-edit-row').forEach(row => {
    const l = newLots.find(x=>x.lot===row.dataset.lot);
    const v = row.querySelector('input').value;
    if (l && l.exp!==v) { changes.push(`ED Lot ${l.lot}: ${l.exp?fmt(l.exp):'-'} → ${v?fmt(v):'-'}`); l.exp = v; }
  });
  if (!changes.length) { closeEdit(); return toast('Tidak ada perubahan.','warn'); }
  items = items.map(i=>i.id===editId?{...i,name,code,brand,permitNo,category:cat,unit,stock,minStock,price,lots:newLots}:i);
  actLog.unshift({id:nextId(), ts:new Date().toISOString(), type:'edit', itemId:orig.id, itemName:orig.name, changes, reason, note,
    ...(orig.stock!==stock ? {stockBefore:orig.stock, stockAfter:stock} : {})});
  save(); closeEdit(); toast('Barang berhasil diperbarui!'); render();
};

// ── Delete Modal ───────────────────────────────────────────────
const openDel = id => {
  const it = items.find(i=>i.id===id); if (!it) return;
  delId = id;
  document.getElementById('delDesc').innerHTML = `Kamu akan menghapus <strong>"${esc(it.name)}"</strong> (stok: ${it.stock} ${esc(it.unit)}). Tindakan ini tidak bisa dibatalkan.`;
  document.getElementById('del_note').value = '';
  document.getElementById('delModal').style.display='flex';
};
const closeDel = () => { document.getElementById('delModal').style.display='none'; delId=null; };
const confirmDel = () => {
  const note = document.getElementById('del_note').value.trim();
  if (!note) return toast('Keterangan hapus wajib diisi!','err');
  const it = items.find(i=>i.id===delId);
  actLog.unshift({id:nextId(), ts:new Date().toISOString(), type:'delete', itemId:it.id, itemName:it.name, stockAtDelete:it.stock, unit:it.unit, reason:note});
  items = items.filter(i=>i.id!==delId);
  save(); closeDel(); toast(`Barang "${it.name}" berhasil dihapus.`); render();
};

// ── Export / Import ────────────────────────────────────────────
const exportData = (format='csv') => {
  if (format==='json') {
    const data = {app:'StockPro', version:2, items,inRec,outRec,opRec,actLog,cats,units,recipients,settings,exportedAt:new Date().toISOString()};
    downloadFile(JSON.stringify(data,null,2), 'application/json', `stockpro_backup_${today()}.json`);
    markBackup();
    return toast('Data berhasil diexport ke JSON!');
  }
  const csv = buildCsv(buildCsvRows());
  downloadFile(csv, 'text/csv;charset=utf-8', `stockpro_backup_${today()}.csv`);
  markBackup();
  toast('Data berhasil diexport ke CSV!');
};
const syncAllDrafts = () => { syncDraftInFromDom(); syncDraftOutFromDom(); syncDraftOpFromDom(); };
const markBackup = () => { ls(LS.lastBackup, new Date().toISOString()); ls(LS.backupSnooze, null); syncAllDrafts(); render(); };
const importData = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const text = String(ev.target.result || '');
      const trimmed = text.trim();
      const isJson = file.name.toLowerCase().endsWith('.json') || trimmed.startsWith('{') || trimmed.startsWith('[');
      if (isJson) {
        applyImportedState(JSON.parse(text));
        toast('Data JSON berhasil diimport!');
      } else {
        const rows = parseCsv(text);
        if (!rows.length) throw new Error('CSV kosong');
        applyImportedState(parseCsvData(rows));
        toast('Data CSV berhasil diimport!');
      }
    } catch { toast('File tidak valid!','err'); }
  };
  r.readAsText(file);
  e.target.value='';
};

// ── Live search (tanpa full re-render) ────────────────────────
const renderMain = () => {
  const active = document.activeElement;
  const preserveFocus = active && active.closest('#main') ? {
    id: active.id,
    selectionStart: typeof active.selectionStart==='number' ? active.selectionStart : null,
    selectionEnd: typeof active.selectionEnd==='number' ? active.selectionEnd : null
  } : null;
  const pages = { dashboard:pageDashboard, in:pageIn, out:pageOut, opname:pageOpname, summary:pageSummary, kartu:pageKartu, manage:pageManage, settings:pageSettings };
  document.getElementById('main').innerHTML = backupBanner() + (pages[page]||pageDashboard)();
  if (preserveFocus && preserveFocus.id) {
    const next = document.getElementById(preserveFocus.id);
    if (next) {
      next.focus();
      if (preserveFocus.selectionStart!==null && typeof next.setSelectionRange==='function') {
        next.setSelectionRange(preserveFocus.selectionStart, preserveFocus.selectionEnd ?? preserveFocus.selectionStart);
      }
    }
  }
};

// ── Init ───────────────────────────────────────────────────────
render();
</script>
</body>
