<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockPro — Monitoring Stok</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px;outline:none;box-sizing:border-box}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* Layout */
#app{display:flex;min-height:100vh}
aside{width:220px;background:#1e293b;color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:20px;border-bottom:1px solid #334155}
.logo h1{font-size:18px;font-weight:800;color:#fff}
.logo p{font-size:11px;color:#94a3b8;margin-top:2px}
nav{flex:1;padding-top:12px}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 20px;background:transparent;color:#94a3b8;border:none;font-size:14px;text-align:left;transition:.15s}
nav button.active{background:#6366f1;color:#fff;font-weight:700}
.sidebar-footer{padding:14px 20px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:8px}
.sidebar-footer button,.sidebar-footer label{background:#334155;color:#e2e8f0;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;text-align:left;display:block;width:100%}
.sidebar-footer .date{font-size:10px;color:#475569}
main{flex:1;padding:28px;overflow-y:auto}

/* Cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-card .icon{font-size:24px}
.stat-card .val{font-size:26px;font-weight:800;margin-top:6px}
.stat-card .lbl{font-size:12px;color:#64748b;margin-top:2px}
.value-banner{background:linear-gradient(135deg,#1e293b,#334155);border-radius:14px;padding:20px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.value-banner .big{color:#fff;font-size:28px;font-weight:800}
.value-banner .sub{color:#94a3b8;font-size:13px;margin-bottom:4px}
.value-banner .note{color:#64748b;font-size:12px;margin-top:4px}
.value-banner .emoji{font-size:48px;opacity:.2}

/* Panels */
.panel{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px;overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.panel-body{padding:20px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px}
.field textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.new-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:14px;margin-bottom:14px}
.new-box .new-title{font-size:12px;font-weight:700;color:#0369a1;margin-bottom:10px}
.line-builder{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.line-row{border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#f8fafc}
.line-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.line-row-title{font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.04em}
.line-grid{display:grid;grid-template-columns:2fr 1.2fr 1fr;gap:12px}
.line-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.line-grid-4{display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;gap:12px}
.line-remove{background:#fff1f2;border:1px solid #fecdd3;color:#e11d48;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700}
.line-add{background:#eef2ff;color:#4f46e5;border:1px dashed #a5b4fc;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;width:100%}
.batch-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.batch-lines{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.batch-line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.72);border:1px solid #dbeafe}
.batch-line-left{font-size:13px}
.batch-line-name{font-weight:700}
.batch-line-sub{font-size:12px;color:#64748b;margin-top:2px}
.batch-line-right{text-align:right;font-size:12px}
.batch-total{font-size:12px;color:#475569;margin-top:10px;font-weight:700}
.warn-box{background:#fefce8;border:1px solid #fde047;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.warn-box .warn-title{font-size:12px;font-weight:700;color:#854d0e;margin-bottom:8px}
.err-hint{font-size:12px;color:#ef4444;padding:6px 0}
.btn-primary{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:14px;width:100%;margin-top:4px}
.btn-warn{background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:14px;width:100%;margin-top:4px}
.btn-sm{border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700}
.btn-edit{background:#eef2ff;color:#6366f1}
.btn-del{background:#fee2e2;color:#ef4444}
.btn-cancel{padding:9px 18px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600}
.btn-save{padding:9px 18px;border-radius:8px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:700}
.btn-del-confirm{padding:9px 18px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-size:13px;font-weight:700}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-weight:700;color:#475569;font-size:11px;text-transform:uppercase;background:#f8fafc}
td{padding:11px 14px;border-top:1px solid #f1f5f9}
tr:nth-child(even) td{background:#fafafa}

/* Badges */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.badge-ok{background:#dcfce7;color:#16a34a}
.badge-low{background:#fee2e2;color:#ef4444}
.badge-in{background:#22c55e;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-out{background:#f59e0b;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-opname{background:#0ea5e9;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-edit{background:#6366f1;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-del{background:#ef4444;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-audit{background:#0f766e;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.change-chip{font-size:12px;color:#475569;background:#fff;padding:3px 8px;border-radius:6px;display:inline-block;margin:2px;border:1px solid #e2e8f0}

/* History cards */
.hist-card{border-radius:10px;padding:12px 14px;margin-bottom:10px}
.hist-in{background:#f0fdf4;border:1px solid #bbf7d0}
.hist-out{background:#fff7ed;border:1px solid #fed7aa}
.hist-opname{background:#eff6ff;border:1px solid #bfdbfe}
.hist-del{background:#fff1f2;border:1px solid #fecdd3}
.hist-edit{background:#f0f9ff;border:1px solid #bae6fd}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-name{font-weight:700;font-size:14px}
.hist-meta{font-size:12px;color:#64748b;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hist-note{font-size:12px;color:#475569;font-style:italic;margin-top:4px}
.hist-scroll{max-height:480px;overflow-y:auto}

/* Alert */
.alert-low{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:16px 20px}
.alert-low h4{font-weight:700;color:#c2410c;margin-bottom:8px}
.low-chips{display:flex;gap:8px;flex-wrap:wrap}
.low-chip{background:#fed7aa;color:#9a3412;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}

/* Summary cards */
.sum-card{color:#fff;border-radius:14px;padding:20px 24px}
.sum-card .s-lbl{font-size:13px;opacity:.8}
.sum-card .s-val{font-size:30px;font-weight:800}
.sum-card .s-sub{font-size:12px;opacity:.7}

/* Tx row */
.tx-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:10px;margin-bottom:8px}
.tx-row-in{background:#f0fdf4;border:1px solid #bbf7d0}
.tx-row-out{background:#fff7ed;border:1px solid #fed7aa}
.tx-row-opname{background:#eff6ff;border:1px solid #bfdbfe}
.tx-info{flex:1;font-size:13px}
.tx-info .tx-name{font-weight:700}
.tx-info .tx-meta{color:#64748b;font-size:12px}
.tx-right{text-align:right}
.tx-right .tx-amt{font-weight:800;font-size:14px}
.tx-right .tx-date{font-size:11px;color:#94a3b8}
.delta-pos{color:#16a34a}
.delta-neg{color:#ef4444}
.delta-zero{color:#475569}

/* Master list */
.tag-list{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px;padding:5px 12px 5px 14px;font-size:13px}
.tag-item button{background:none;border:none;color:#94a3b8;font-size:14px;padding:0 2px;line-height:1}

@media (max-width:1100px){
  .line-grid,.line-grid-2,.line-grid-4,.batch-meta,.three-col,.two-col,.stat-grid{grid-template-columns:1fr}
}

/* Search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border-radius:8px;border:1px solid #e2e8f0;background:#f8fafc;font-size:13px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;font-size:16px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;padding:28px;width:480px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #f1f5f9}
.modal-title{font-weight:800;font-size:16px}
.modal-close{background:#f1f5f9;border:none;border-radius:8px;width:32px;height:32px;font-size:16px;color:#64748b}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* Toast */
#toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.18);display:none;color:#fff}

/* Empty */
.empty{text-align:center;color:#94a3b8;padding:40px 0;font-size:13px}

/* Page title */
.page-title{font-size:22px;font-weight:800;margin-bottom:4px}
.page-sub{color:#64748b;font-size:13px;margin-bottom:24px}

mark{background:#fef08a;color:#1e293b;border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div id="toast"></div>

<div id="app">
  <aside>
    <div class="logo">
      <h1>📦 StockPro</h1>
      <p>Sistem Monitoring Stok</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <button onclick="exportData('csv')">⬇️ Export CSV</button>
      <label>⬆️ Import CSV / JSON<input type="file" accept=".csv,.json" onchange="importData(event)" style="display:none"></label>
      <button onclick="exportData('json')">🗂️ Export JSON</button>
      <div class="date" id="dateLabel"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- Edit Modal -->
<div class="overlay" id="editModal" style="display:none">
  <div class="modal">
    <div class="modal-head"><span class="modal-title">✏️ Edit Barang</span><button class="modal-close" onclick="closeEdit()">✕</button></div>
    <div class="field"><label>Nama Barang *</label><input id="e_name"></div>
    <div class="row2">
      <div class="field"><label>Kategori</label><select id="e_cat"></select></div>
      <div class="field"><label>Satuan</label><select id="e_unit"></select></div>
    </div>
    <div class="row3">
      <div class="field"><label>Stok</label><input type="number" min="0" id="e_stock"></div>
      <div class="field"><label>Min Stok</label><input type="number" min="0" id="e_minstock"></div>
      <div class="field"><label>Harga (Rp)</label><input type="number" min="0" id="e_price"></div>
    </div>
    <div class="warn-box">
      <div class="warn-title">⚠️ Wajib diisi untuk audit trail</div>
      <div class="field"><label>Alasan Perubahan *</label><input id="e_reason" placeholder="contoh: koreksi data, stok opname..."></div>
      <div class="field"><label>Keterangan Tambahan</label><textarea id="e_note" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEdit()">Batal</button>
      <button class="btn-save" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="overlay" id="delModal" style="display:none">
  <div class="modal">
    <div class="modal-head"><span class="modal-title" style="color:#ef4444">🗑️ Hapus Barang</span><button class="modal-close" onclick="closeDel()">✕</button></div>
    <p id="delDesc" style="font-size:13px;color:#475569;margin-bottom:16px"></p>
    <div class="field"><label>Keterangan / Alasan Hapus *</label><textarea id="del_note" rows="3"></textarea></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDel()">Batal</button>
      <button class="btn-del-confirm" onclick="confirmDel()">Hapus</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
const LS = {
  items:'sp_items',
  inRec:'sp_in',
  outRec:'sp_out',
  opRec:'sp_opname',
  actLog:'sp_log',
  cats:'sp_cats',
  units:'sp_units',
  recipients:'sp_recipients'
};
const lg = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch { return d; } };
const ls = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

let items      = lg(LS.items, []);
let inRec      = lg(LS.inRec, []);
let outRec     = lg(LS.outRec, []);
let opRec      = lg(LS.opRec, []);
let actLog     = lg(LS.actLog, []);
let cats       = lg(LS.cats, []);
let units      = lg(LS.units, []);
let recipients = lg(LS.recipients, []);
let page       = 'dashboard';
let editId     = null;
let delId      = null;
let searchSummary = '';
let searchManage  = '';
let seq = Date.now();

const save = () => {
  ls(LS.items,items);
  ls(LS.inRec,inRec);
  ls(LS.outRec,outRec);
  ls(LS.opRec,opRec);
  ls(LS.actLog,actLog);
  ls(LS.cats,cats);
  ls(LS.units,units);
  ls(LS.recipients,recipients);
};

// ── Helpers ────────────────────────────────────────────────────
const nextId = () => ++seq;
const fmt   = d => new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const today = () => new Date().toISOString().slice(0,10);
const fmtRp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escAttr = s => esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const diffClass = n => n>0 ? 'delta-pos' : n<0 ? 'delta-neg' : 'delta-zero';
const fmtDiff = n => `${n>0?'+':n<0?'':''}${n}`;
const toNum = (v, fallback=0) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const uniqText = arr => [...new Map((Array.isArray(arr)?arr:[])
  .map(v => String(v||'').trim())
  .filter(Boolean)
  .map(v => [v.toLowerCase(), v])).values()];

const fuzzy = (str, pat) => {
  if (!pat) return true;
  const s=str.toLowerCase(), p=pat.toLowerCase(); let pi=0;
  for (let i=0;i<s.length&&pi<p.length;i++) if(s[i]===p[pi]) pi++;
  return pi===p.length;
};

const hl = (text, query) => {
  if (!query) return esc(text);
  const s=text.toLowerCase(), p=query.toLowerCase();
  const used=new Set(); let pi=0;
  for (let i=0;i<s.length&&pi<p.length;i++) if(s[i]===p[pi]){used.add(i);pi++;}
  return [...text].map((ch,i) => used.has(i)?`<mark>${esc(ch)}</mark>`:esc(ch)).join('');
};

const CSV_HEADERS = [
  'record_type','audit_type','key','value','id','batch_id','line_index','date','ts',
  'item_id','name','category','qty','unit','price','supplier','recipient','reason','note',
  'stock','min_stock','system_stock','actual_stock','diff','changes_json'
];

const csvCell = v => {
  const s = String(v ?? '');
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
};

const buildCsv = rows => [
  CSV_HEADERS.map(csvCell).join(','),
  ...rows.map(row => CSV_HEADERS.map(h => csvCell(row[h] ?? '')).join(','))
].join('\r\n');

const parseCsv = text => {
  const rows = [];
  let row = [];
  let cell = '';
  let i = 0;
  let inQuotes = false;
  while (i < text.length) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i+1] === '"') { cell += '"'; i += 2; continue; }
        inQuotes = false;
      } else cell += ch;
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(cell); cell = '';
    } else if (ch === '\n') {
      row.push(cell); rows.push(row); row = []; cell = '';
    } else if (ch !== '\r') {
      cell += ch;
    }
    i++;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows.shift().map(h => h.trim());
  return rows
    .filter(cols => cols.some(col => String(col).trim() !== ''))
    .map(cols => Object.fromEntries(headers.map((h, idx) => [h, cols[idx] ?? ''])));
};

const downloadFile = (content, type, filename) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = filename;
  a.click();
};

const buildCsvRows = () => {
  const rows = [{record_type:'meta', key:'exported_at', value:new Date().toISOString()}];
  items.forEach(it => rows.push({
    record_type:'item', id:it.id, name:it.name, category:it.category, stock:it.stock, unit:it.unit, min_stock:it.minStock, price:it.price
  }));
  cats.forEach(v => rows.push({record_type:'master', key:'cat', value:v}));
  units.forEach(v => rows.push({record_type:'master', key:'unit', value:v}));
  getRecipientList().forEach(v => rows.push({record_type:'master', key:'recipient', value:v}));
  inRec.forEach(tx => (tx.lines||[]).forEach((line, idx) => rows.push({
    record_type:'in_line', batch_id:tx.id, line_index:idx, date:tx.date, supplier:tx.supplier||'', note:tx.note||'',
    item_id:line.itemId, name:line.name, category:line.category, qty:line.qty, unit:line.unit, price:line.price
  })));
  outRec.forEach(tx => (tx.lines||[]).forEach((line, idx) => rows.push({
    record_type:'out_line', batch_id:tx.id, line_index:idx, date:tx.date, recipient:tx.recipient||'', note:tx.note||'',
    item_id:line.itemId, name:line.name, category:line.category, qty:line.qty, unit:line.unit
  })));
  opRec.forEach(tx => (tx.lines||[]).forEach((line, idx) => rows.push({
    record_type:'op_line', batch_id:tx.id, line_index:idx, date:tx.date, reason:tx.reason||'', note:tx.note||'',
    item_id:line.itemId, name:line.itemName, category:line.category, unit:line.unit,
    system_stock:line.systemStock, actual_stock:line.actualStock, diff:line.diff
  })));
  actLog.forEach(a => rows.push({
    record_type:'audit', audit_type:a.type, id:a.id, ts:a.ts, name:a.itemName, unit:a.unit||'', reason:a.reason||'', note:a.note||'',
    stock:a.stockAtDelete ?? '', system_stock:a.systemStock ?? '', actual_stock:a.actualStock ?? '', diff:a.diff ?? '',
    changes_json: JSON.stringify(a.changes||[])
  }));
  return rows;
};

const parseCsvData = rows => {
  const nextState = { items:[], inRec:[], outRec:[], opRec:[], actLog:[], cats:[], units:[], recipients:[] };
  const inMap = new Map(), outMap = new Map(), opMap = new Map();
  rows.forEach(row => {
    const type = String(row.record_type||'').trim();
    if (type==='item') {
      nextState.items.push({
        id: toNum(row.id, nextId()),
        name: row.name,
        category: row.category,
        stock: toNum(row.stock, 0),
        unit: row.unit,
        minStock: toNum(row.min_stock, 0),
        price: toNum(row.price, 0)
      });
    } else if (type==='master') {
      if (row.key==='cat') nextState.cats.push(row.value);
      if (row.key==='unit') nextState.units.push(row.value);
      if (row.key==='recipient') nextState.recipients.push(row.value);
    } else if (type==='in_line') {
      const id = toNum(row.batch_id, nextId());
      if (!inMap.has(id)) inMap.set(id, { id, date: row.date || today(), supplier: row.supplier || '', note: row.note || '', lines: [] });
      inMap.get(id).lines.push({
        itemId: row.item_id==='' ? null : toNum(row.item_id, null),
        name: row.name,
        category: row.category,
        qty: toNum(row.qty, 0),
        unit: row.unit,
        price: toNum(row.price, 0)
      });
    } else if (type==='out_line') {
      const id = toNum(row.batch_id, nextId());
      if (!outMap.has(id)) outMap.set(id, { id, date: row.date || today(), recipient: row.recipient || '', note: row.note || '', lines: [] });
      outMap.get(id).lines.push({
        itemId: row.item_id==='' ? null : toNum(row.item_id, null),
        name: row.name,
        category: row.category,
        qty: toNum(row.qty, 0),
        unit: row.unit
      });
    } else if (type==='op_line') {
      const id = toNum(row.batch_id, nextId());
      if (!opMap.has(id)) opMap.set(id, { id, date: row.date || today(), reason: row.reason || '', note: row.note || '', lines: [] });
      opMap.get(id).lines.push({
        itemId: row.item_id==='' ? null : toNum(row.item_id, null),
        itemName: row.name,
        category: row.category,
        unit: row.unit,
        systemStock: toNum(row.system_stock, 0),
        actualStock: toNum(row.actual_stock, 0),
        diff: toNum(row.diff, 0)
      });
    } else if (type==='audit') {
      let changes = [];
      try { changes = JSON.parse(row.changes_json || '[]'); } catch {}
      nextState.actLog.push({
        id: toNum(row.id, nextId()),
        ts: row.ts || new Date().toISOString(),
        type: row.audit_type || 'edit',
        itemName: row.name || '',
        unit: row.unit || '',
        reason: row.reason || '',
        note: row.note || '',
        stockAtDelete: row.stock==='' ? undefined : toNum(row.stock, 0),
        systemStock: row.system_stock==='' ? undefined : toNum(row.system_stock, 0),
        actualStock: row.actual_stock==='' ? undefined : toNum(row.actual_stock, 0),
        diff: row.diff==='' ? undefined : toNum(row.diff, 0),
        changes: Array.isArray(changes) ? changes : []
      });
    }
  });
  nextState.inRec = [...inMap.values()];
  nextState.outRec = [...outMap.values()];
  nextState.opRec = [...opMap.values()];
  return nextState;
};

const applyImportedState = data => {
  if(Array.isArray(data.items)) items = data.items;
  if(Array.isArray(data.inRec)) inRec = data.inRec;
  if(Array.isArray(data.outRec)) outRec = data.outRec;
  if(Array.isArray(data.opRec)) opRec = data.opRec;
  if(Array.isArray(data.actLog)) actLog = data.actLog;
  if(Array.isArray(data.cats)) cats = data.cats;
  if(Array.isArray(data.units)) units = data.units;
  if(Array.isArray(data.recipients)) recipients = data.recipients;
  normalizeState();
  resetDraftIn();
  resetDraftOut();
  resetDraftOp();
  save();
  render();
};

const BULK_HEADERS = {
  in: ['kode_transaksi','tanggal','supplier','tipe_barang','nama_barang_existing','nama_barang_baru','kategori_barang_baru','satuan_barang_baru','jumlah','harga_satuan','keterangan'],
  out: ['kode_transaksi','tanggal','tujuan_penerima','nama_barang','jumlah','keterangan','stok_saat_ini','satuan'],
  opname: ['kode_sesi','tanggal','alasan_opname','nama_barang','stok_sistem','stok_fisik','satuan','catatan']
};

const bulkCell = (row, key) => String(row[key] ?? '').trim();
const groupByKey = (rows, keyName) => {
  const map = new Map();
  rows.forEach((row, idx) => {
    const key = bulkCell(row, keyName) || `${keyName || 'group'}_${idx+1}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  });
  return [...map.entries()];
};

const findExistingItem = (name, category='', unit='') => {
  const n = String(name||'').trim().toLowerCase();
  const c = String(category||'').trim().toLowerCase();
  const u = String(unit||'').trim().toLowerCase();
  return items.find(it =>
    it.name.toLowerCase()===n &&
    (!c || it.category.toLowerCase()===c) &&
    (!u || it.unit.toLowerCase()===u)
  ) || null;
};

const buildBulkTemplateRows = type => {

    const base = items.length ? items.map((it, idx) => ({
      kode_transaksi: idx<2 ? `IN-${today()}-A` : `IN-${today()}-R${idx+1}`,

      kategori_barang_baru: '',

    })) : [{

      supplier: 'PT Contoh Supplier',
      tipe_barang: 'existing',
      nama_barang_existing: 'Contoh Barang',

    }];
    return base.concat([{
      kode_transaksi: `IN-${today()}-BARU`,
      tanggal: today(),
      supplier: '',
      tipe_barang: 'baru',
      nama_barang_existing: '',
      nama_barang_baru: '',
      kategori_barang_baru: cats[0] || '',
      satuan_barang_baru: units[0] || '',
      jumlah: '',

    }]);
  }
  if (type==='out') {
    return (items.length ? items : [{name:'Contoh Barang',stock:0,unit:units[0]||'pcs'}]).map((it, idx) => ({
      kode_transaksi: idx<2 ? `OUT-${today()}-A` : `OUT-${today()}-R${idx+1}`,
      tanggal: today(),
      tujuan_penerima: '',
      nama_barang: it.name,
      jumlah: '',
      keterangan: '',
      stok_saat_ini: it.stock ?? '',
      satuan: it.unit || ''
    }));
  }
  return (items.length ? items : [{name:'Contoh Barang',stock:0,unit:units[0]||'pcs'}]).map((it, idx) => ({
    kode_sesi: idx<2 ? `OP-${today()}-A` : `OP-${today()}-R${idx+1}`,
    tanggal: today(),
    alasan_opname: idx===0 ? 'stok opname bulanan' : '',
    nama_barang: it.name,
    stok_sistem: it.stock ?? '',
    stok_fisik: '',
    satuan: it.unit || '',
    catatan: ''
  }));
};

const downloadBulkTemplate = type => {
  const headers = BULK_HEADERS[type];
  if (!headers) return;
  const rows = buildBulkTemplateRows(type);
  const csv = [
    headers.map(csvCell).join(','),
    ...rows.map(row => headers.map(h => csvCell(row[h] ?? '')).join(','))
  ].join('\r\n');
  const name = type==='in' ? 'barang_masuk' : type==='out' ? 'barang_keluar' : 'stok_opname';
  downloadFile(csv, 'text/csv;charset=utf-8', `template_${name}_${today()}.csv`);
  toast(`Template CSV ${name.replace(/_/g,' ')} berhasil didownload.`);
};

const openCsvGuide = () => {
  const url = new URL('panduan_bulk_import_csv.md', window.location.href).href;
  window.open(url, '_blank', 'noopener');
};

const importBulkCsv = (e, type) => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const rows = parseCsv(String(ev.target.result || ''));
      if (!rows.length) throw new Error('CSV kosong');
      if (type==='in') importBulkInRows(rows);
      else if (type==='out') importBulkOutRows(rows);
      else if (type==='opname') importBulkOpRows(rows);
      else throw new Error('Tipe import tidak dikenali');
    } catch (err) {
      toast(err && err.message ? err.message : 'File bulk CSV tidak valid!','err');
    } finally {
      e.target.value = '';
    }
  };
  r.readAsText(file);
};

const importBulkInRows = rows => {
  let nextItems = items.map(i => ({...i}));
  const txList = [];
  for (const [code, group] of groupByKey(rows.filter(r => bulkCell(r,'nama_barang') || bulkCell(r,'jumlah')), 'kode_transaksi')) {
    const validRows = group.filter(r => bulkCell(r,'nama_barang') && bulkCell(r,'jumlah'));
    if (!validRows.length) continue;
    const supplier = bulkCell(validRows[0],'supplier');
    const note = bulkCell(validRows[0],'keterangan');
    const date = bulkCell(validRows[0],'tanggal') || today();
    const lines = [];
    validRows.forEach((row, idx) => {
      const typeRaw = bulkCell(row,'tipe_barang').toLowerCase();
      const isNew = typeRaw === 'baru' || (!bulkCell(row,'nama_barang_existing') && !!bulkCell(row,'nama_barang_baru'));
      const name = isNew ? bulkCell(row,'nama_barang_baru') : (bulkCell(row,'nama_barang_existing') || bulkCell(row,'nama_barang'));
      const category = isNew ? bulkCell(row,'kategori_barang_baru') : bulkCell(row,'kategori');
      const unit = isNew ? bulkCell(row,'satuan_barang_baru') : bulkCell(row,'satuan');
      const qty = toNum(bulkCell(row,'jumlah'), 0);
      const priceRaw = bulkCell(row,'harga_satuan');
      const price = priceRaw==='' ? null : toNum(priceRaw, NaN);
      if (!name) throw new Error(`CSV masuk: nama_barang kosong pada batch ${code}, baris ${idx+1}`);
      if (!qty || qty<=0) throw new Error(`CSV masuk: jumlah tidak valid untuk ${name}`);
      if (price!==null && !Number.isFinite(price)) throw new Error(`CSV masuk: harga_satuan tidak valid untuk ${name}`);
      let itemIdx = nextItems.findIndex(it => it.name.toLowerCase()===name.toLowerCase() && (!category || it.category.toLowerCase()===category.toLowerCase()) && (!unit || it.unit.toLowerCase()===unit.toLowerCase()));
      if (itemIdx===-1) {
        if (!category || !unit) throw new Error(`CSV masuk: barang baru "${name}" wajib isi kategori dan satuan`);
        itemIdx = nextItems.push({id:nextId(), name, category, stock:0, unit, minStock:10, price:0}) - 1;
      }
      const finalPrice = price===null ? (nextItems[itemIdx].price||0) : price;
      nextItems[itemIdx].stock += qty;
      nextItems[itemIdx].price = finalPrice;
      lines.push({itemId:nextItems[itemIdx].id, name:nextItems[itemIdx].name, category:nextItems[itemIdx].category, qty, unit:nextItems[itemIdx].unit, price:finalPrice});
    });
    txList.push({id:nextId(), date, supplier, note, lines});
  }
  if (!txList.length) throw new Error('CSV masuk tidak punya baris transaksi yang bisa diproses');
  items = nextItems;
  inRec = [...txList.reverse(), ...inRec];
  resetDraftIn();
  save();
  render();
  toast(`Bulk import barang masuk berhasil (${txList.length} transaksi).`);
};

const importBulkOutRows = rows => {
  let nextItems = items.map(i => ({...i}));
  const txList = [];
  const nextRecipients = [...recipients];
  for (const [code, group] of groupByKey(rows.filter(r => bulkCell(r,'nama_barang') || bulkCell(r,'jumlah')), 'kode_transaksi')) {
    const validRows = group.filter(r => bulkCell(r,'nama_barang') && bulkCell(r,'jumlah'));
    if (!validRows.length) continue;
    const recipient = bulkCell(validRows[0],'tujuan_penerima');
    const note = bulkCell(validRows[0],'keterangan');
    const date = bulkCell(validRows[0],'tanggal') || today();
    const lines = [];
    validRows.forEach((row, idx) => {
      const name = bulkCell(row,'nama_barang');
      const unit = bulkCell(row,'satuan');
      const qty = toNum(bulkCell(row,'jumlah'), 0);
      if (!name) throw new Error(`CSV keluar: nama_barang kosong pada batch ${code}, baris ${idx+1}`);
      if (!qty || qty<=0) throw new Error(`CSV keluar: jumlah tidak valid untuk ${name}`);
      const itemIdx = nextItems.findIndex(it => it.name.toLowerCase()===name.toLowerCase() && (!unit || it.unit.toLowerCase()===unit.toLowerCase()));
      if (itemIdx===-1) throw new Error(`CSV keluar: barang "${name}" tidak ditemukan`);
      if (qty>nextItems[itemIdx].stock) throw new Error(`CSV keluar: stok ${name} tidak cukup`);
      nextItems[itemIdx].stock -= qty;
      lines.push({itemId:nextItems[itemIdx].id, name:nextItems[itemIdx].name, category:nextItems[itemIdx].category, qty, unit:nextItems[itemIdx].unit});
    });
    txList.push({id:nextId(), date, recipient, note, lines});
    if (recipient && !nextRecipients.map(r=>r.toLowerCase()).includes(recipient.toLowerCase())) nextRecipients.push(recipient);
  }
  if (!txList.length) throw new Error('CSV keluar tidak punya baris transaksi yang bisa diproses');
  items = nextItems;
  recipients = uniqText(nextRecipients);
  outRec = [...txList.reverse(), ...outRec];
  resetDraftOut();
  save();
  render();
  toast(`Bulk import barang keluar berhasil (${txList.length} transaksi).`);
};

const importBulkOpRows = rows => {
  let nextItems = items.map(i => ({...i}));
  const txList = [];
  const newLogs = [];
  for (const [code, group] of groupByKey(rows.filter(r => bulkCell(r,'nama_barang') || bulkCell(r,'stok_fisik')), 'kode_sesi')) {
    const validRows = group.filter(r => bulkCell(r,'nama_barang') && bulkCell(r,'stok_fisik'));
    if (!validRows.length) continue;
    const reason = bulkCell(validRows[0],'alasan_opname');
    const note = bulkCell(validRows[0],'catatan');
    const date = bulkCell(validRows[0],'tanggal') || today();
    if (!reason) throw new Error(`CSV opname: alasan_opname wajib diisi untuk sesi ${code}`);
    const seen = new Set();
    const lines = [];
    validRows.forEach((row, idx) => {
      const name = bulkCell(row,'nama_barang');
      const unit = bulkCell(row,'satuan');
      const actual = toNum(bulkCell(row,'stok_fisik'), NaN);
      if (!name) throw new Error(`CSV opname: nama_barang kosong pada sesi ${code}, baris ${idx+1}`);
      if (!Number.isFinite(actual) || actual<0) throw new Error(`CSV opname: stok_fisik tidak valid untuk ${name}`);
      const itemIdx = nextItems.findIndex(it => it.name.toLowerCase()===name.toLowerCase() && (!unit || it.unit.toLowerCase()===unit.toLowerCase()));
      if (itemIdx===-1) throw new Error(`CSV opname: barang "${name}" tidak ditemukan`);
      if (seen.has(nextItems[itemIdx].id)) throw new Error(`CSV opname: barang "${name}" dobel dalam satu sesi`);
      seen.add(nextItems[itemIdx].id);
      const systemStock = nextItems[itemIdx].stock;
      const diff = actual - systemStock;
      nextItems[itemIdx].stock = actual;
      lines.push({itemId:nextItems[itemIdx].id, itemName:nextItems[itemIdx].name, category:nextItems[itemIdx].category, unit:nextItems[itemIdx].unit, systemStock, actualStock:actual, diff});
      newLogs.push({id:nextId(), ts:new Date().toISOString(), type:'opname', itemName:nextItems[itemIdx].name, systemStock, actualStock:actual, diff, unit:nextItems[itemIdx].unit, reason, note});
    });
    txList.push({id:nextId(), date, reason, note, lines});
  }
  if (!txList.length) throw new Error('CSV opname tidak punya baris sesi yang bisa diproses');
  items = nextItems;
  opRec = [...txList.reverse(), ...opRec];
  actLog = [...newLogs.reverse(), ...actLog];
  resetDraftOp();
  save();
  render();
  toast(`Bulk import stok opname berhasil (${txList.length} sesi).`);
};

const normalizeItems = arr => (Array.isArray(arr)?arr:[]).map(it => ({
  id: toNum(it.id, nextId()),
  name: String(it.name||'').trim(),
  category: String(it.category||'').trim(),
  stock: Math.max(0, toNum(it.stock, 0)),
  unit: String(it.unit||'').trim(),
  minStock: Math.max(0, toNum(it.minStock, 0)),
  price: Math.max(0, toNum(it.price, 0))
})).filter(it => it.name);

const normalizeInLine = line => ({
  itemId: line.itemId===undefined || line.itemId===null || line.itemId==='' ? null : toNum(line.itemId, null),
  name: String(line.name||line.itemName||'').trim(),
  category: String(line.category||'').trim(),
  qty: Math.max(0, toNum(line.qty, 0)),
  unit: String(line.unit||'').trim(),
  price: Math.max(0, toNum(line.price, 0))
});
const normalizeOutLine = line => ({
  itemId: line.itemId===undefined || line.itemId===null || line.itemId==='' ? null : toNum(line.itemId, null),
  name: String(line.name||line.itemName||'').trim(),
  category: String(line.category||'').trim(),
  qty: Math.max(0, toNum(line.qty, 0)),
  unit: String(line.unit||'').trim()
});
const normalizeOpLine = line => ({
  itemId: line.itemId===undefined || line.itemId===null || line.itemId==='' ? null : toNum(line.itemId, null),
  itemName: String(line.itemName||line.name||'').trim(),
  category: String(line.category||'').trim(),
  unit: String(line.unit||'').trim(),
  systemStock: Math.max(0, toNum(line.systemStock, 0)),
  actualStock: Math.max(0, toNum(line.actualStock, 0)),
  diff: toNum(line.diff, toNum(line.actualStock, 0) - toNum(line.systemStock, 0))
});

const normalizeInRec = arr => (Array.isArray(arr)?arr:[]).map(tx => {
  if (Array.isArray(tx.lines)) {
    return {
      id: toNum(tx.id, nextId()),
      date: tx.date || today(),
      supplier: String(tx.supplier||'').trim(),
      note: String(tx.note||'').trim(),
      lines: tx.lines.map(normalizeInLine).filter(line => line.name && line.qty>0)
    };
  }
  const line = normalizeInLine(tx||{});
  return {
    id: toNum(tx&&tx.id, nextId()),
    date: tx&&tx.date ? tx.date : today(),
    supplier: String(tx&&tx.supplier||'').trim(),
    note: String(tx&&tx.note||'').trim(),
    lines: line.name && line.qty>0 ? [line] : []
  };
}).filter(tx => tx.lines.length).sort((a,b)=>b.id-a.id);

const normalizeOutRec = arr => (Array.isArray(arr)?arr:[]).map(tx => {
  if (Array.isArray(tx.lines)) {
    return {
      id: toNum(tx.id, nextId()),
      date: tx.date || today(),
      recipient: String(tx.recipient||'').trim(),
      note: String(tx.note||'').trim(),
      lines: tx.lines.map(normalizeOutLine).filter(line => line.name && line.qty>0)
    };
  }
  const line = normalizeOutLine(tx||{});
  return {
    id: toNum(tx&&tx.id, nextId()),
    date: tx&&tx.date ? tx.date : today(),
    recipient: String(tx&&tx.recipient||'').trim(),

    lines: line.name && line.qty>0 ? [line] : []
  };
}).filter(tx => tx.lines.length).sort((a,b)=>b.id-a.id);

const normalizeOpRec = arr => (Array.isArray(arr)?arr:[]).map(tx => {
  if (Array.isArray(tx.lines)) {
    return {
      id: toNum(tx.id, nextId()),
      date: tx.date || today(),
      reason: String(tx.reason||'').trim(),
      note: String(tx.note||'').trim(),
      lines: tx.lines.map(normalizeOpLine).filter(line => line.itemName)
    };

    id: toNum(tx&&tx.id, nextId()),
    date: tx&&tx.date ? tx.date : today(),
    reason: String(tx&&tx.reason||'').trim(),
    note: String(tx&&tx.note||'').trim(),
    lines: line.itemName ? [line] : []
  };
}).filter(tx => tx.lines.length).sort((a,b)=>b.id-a.id);

const normalizeState = () => {
  cats = uniqText(cats);
  units = uniqText(units);
  recipients = uniqText(recipients);
  items = normalizeItems(items);
  inRec = normalizeInRec(inRec);
  outRec = normalizeOutRec(outRec);
  opRec = normalizeOpRec(opRec);
  seq = Math.max(seq, ...items.map(i=>i.id||0), ...inRec.map(r=>r.id||0), ...outRec.map(r=>r.id||0), ...opRec.map(r=>r.id||0), ...actLog.map(r=>toNum(r.id,0)));
};

const getInLines = () => inRec.flatMap(tx => (tx.lines||[]).map((line, idx) => ({...line, batchId:tx.id, lineId:`${tx.id}-in-${idx}`, date:tx.date, supplier:tx.supplier||'', note:tx.note||''})));
const getOutLines = () => outRec.flatMap(tx => (tx.lines||[]).map((line, idx) => ({...line, batchId:tx.id, lineId:`${tx.id}-out-${idx}`, date:tx.date, recipient:tx.recipient||'', note:tx.note||''})));
const getOpLines = () => opRec.flatMap(tx => (tx.lines||[]).map((line, idx) => ({...line, batchId:tx.id, lineId:`${tx.id}-op-${idx}`, date:tx.date, reason:tx.reason||'', note:tx.note||''})));
const getSupplierList = () => uniqText(inRec.map(tx => tx.supplier).filter(Boolean));
const getRecipientList = () => uniqText([...(Array.isArray(recipients)?recipients:[]), ...outRec.map(tx => tx.recipient).filter(Boolean)]);

const newOutRow = () => ({ rowId: nextId(), itemId:'', qty:'' });
const newOpRow = () => ({ rowId: nextId(), itemId:'', actualStock:'' });

let toastTimer;
const toast = (msg, type='ok') => {
  const el = document.getElementById('toast');
  el.textContent = (type==='err'?'❌ ':type==='warn'?'⚠️ ':'✅ ') + msg;
  el.style.background = type==='err'?'#ef4444':type==='warn'?'#f59e0b':'#22c55e';
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display='none', 3000);
};

const syncDraftInFromDom = () => {
  const dateEl = document.getElementById('f_date');
  if (!dateEl) return;
  draftIn.date = dateEl.value || today();
  draftIn.supplierSelect = document.getElementById('f_supId').value;
  draftIn.newSupplier = (document.getElementById('f_newSup')||{value:''}).value;
  draftIn.note = document.getElementById('f_note').value;
  draftIn.rows = [...document.querySelectorAll('#in_rows .line-row')].map(row => ({
    rowId: Number(row.dataset.rowId),
    itemId: row.querySelector('[data-field="itemId"]').value,
    newName: (row.querySelector('[data-field="newName"]')||{value:''}).value,
    category: (row.querySelector('[data-field="category"]')||{value:''}).value,
    unit: (row.querySelector('[data-field="unit"]')||{value:''}).value,
    qty: (row.querySelector('[data-field="qty"]')||{value:''}).value,
    price: (row.querySelector('[data-field="price"]')||{value:''}).value
  }));
};
const syncDraftOutFromDom = () => {
  const dateEl = document.getElementById('o_date');
  if (!dateEl) return;
  draftOut.date = dateEl.value || today();
  draftOut.recipientSelect = document.getElementById('o_recipientSel').value;
  draftOut.newRecipient = (document.getElementById('o_newRecipient')||{value:''}).value;
  draftOut.note = document.getElementById('o_note').value;
  draftOut.rows = [...document.querySelectorAll('#out_rows .line-row')].map(row => ({
    rowId: Number(row.dataset.rowId),
    itemId: row.querySelector('[data-field="itemId"]').value,
    qty: (row.querySelector('[data-field="qty"]')||{value:''}).value
  }));
};
const syncDraftOpFromDom = () => {
  const dateEl = document.getElementById('op_date');
  if (!dateEl) return;
  draftOp.date = dateEl.value || today();
  draftOp.reason = document.getElementById('op_reason').value;
  draftOp.note = document.getElementById('op_note').value;
  draftOp.rows = [...document.querySelectorAll('#op_rows .line-row')].map(row => ({
    rowId: Number(row.dataset.rowId),
    itemId: row.querySelector('[data-field="itemId"]').value,

const inSupplierChange = val => { syncDraftInFromDom(); draftIn.supplierSelect = val; renderMain(); };
const outRecipientChange = val => { syncDraftOutFromDom(); draftOut.recipientSelect = val; renderMain(); };
const inRowItemChange = (rowId, val) => {
  syncDraftInFromDom();
  const row = draftIn.rows.find(r => r.rowId===rowId);
  if (!row) return;
  row.itemId = val;
  if (val==='__new__') {
    row.category = row.category || cats[0] || '';
    row.unit = row.unit || units[0] || '';
  }
  renderMain();
};
const addInRow = () => { syncDraftInFromDom(); draftIn.rows.push(newInRow()); renderMain(); };
const addOutRow = () => { syncDraftOutFromDom(); draftOut.rows.push(newOutRow()); renderMain(); };
const addOpRow = () => { syncDraftOpFromDom(); draftOp.rows.push(newOpRow()); renderMain(); };
const removeInRow = rowId => {
  syncDraftInFromDom();
  draftIn.rows = draftIn.rows.filter(r => r.rowId!==rowId);
  if (!draftIn.rows.length) draftIn.rows = [newInRow()];
  renderMain();
};
const removeOutRow = rowId => {
  syncDraftOutFromDom();
  draftOut.rows = draftOut.rows.filter(r => r.rowId!==rowId);
  if (!draftOut.rows.length) draftOut.rows = [newOutRow()];
  renderMain();
};
const removeOpRow = rowId => {

  draftOp.rows = draftOp.rows.filter(r => r.rowId!==rowId);

};

const submitIn = () => {
  syncDraftInFromDom();
  const supplier = draftIn.supplierSelect==='__new__' ? draftIn.newSupplier.trim() : draftIn.supplierSelect.trim();
  if (draftIn.supplierSelect==='__new__' && !supplier) return toast('Nama supplier wajib diisi!','err');
  if (!draftIn.rows.length) return toast('Tambahkan minimal 1 baris barang!','err');
  let nextItems = items.map(i => ({...i}));
  const lines = [];
  for (const row of draftIn.rows) {
    const qty = toNum(row.qty, 0);
    const price = row.price==='' ? null : Number(row.price);
    if (!row.itemId) return toast('Semua baris wajib memilih barang!','err');
    if (!qty || qty<=0) return toast('Jumlah di setiap baris harus lebih dari 0!','err');
    if (price!==null && (!Number.isFinite(price) || price<0)) return toast('Harga tidak valid!','err');
    if (row.itemId==='__new__') {
      const name = row.newName.trim();
      const category = row.category;
      const unit = row.unit;
      if (!name || !category || !unit) return toast('Barang baru wajib punya nama, kategori, dan satuan!','err');
      let idx = nextItems.findIndex(i => i.name.toLowerCase()===name.toLowerCase() && i.category.toLowerCase()===category.toLowerCase() && i.unit.toLowerCase()===unit.toLowerCase());
      if (idx===-1) {
        idx = nextItems.push({id:nextId(), name, category, stock:0, unit, minStock:10, price:0}) - 1;
      }
      const finalPrice = price===null ? (nextItems[idx].price||0) : price;
      nextItems[idx].stock += qty;
      nextItems[idx].price = finalPrice;
      lines.push({itemId:nextItems[idx].id, name:nextItems[idx].name, category:nextItems[idx].category, qty, unit:nextItems[idx].unit, price:finalPrice});
    } else {
      const idx = nextItems.findIndex(i => i.id===Number(row.itemId));
      if (idx===-1) return toast('Ada barang yang tidak ditemukan di sistem!','err');
      const finalPrice = price===null ? (nextItems[idx].price||0) : price;
      nextItems[idx].stock += qty;
      nextItems[idx].price = finalPrice;
      lines.push({itemId:nextItems[idx].id, name:nextItems[idx].name, category:nextItems[idx].category, qty, unit:nextItems[idx].unit, price:finalPrice});
    }
  }
  items = nextItems;
  inRec.unshift({id:nextId(), date:draftIn.date||today(), supplier, note:draftIn.note.trim(), lines});
  save();
  resetDraftIn();
  toast(`Transaksi barang masuk tersimpan (${lines.length} produk).`);
  render();
};

  if (draftOut.recipientSelect==='__new__' && !recipient) return toast('Nama tujuan / penerima wajib diisi!','err');
  if (!draftOut.rows.length) return toast('Tambahkan minimal 1 baris barang!','err');
  let nextItems = items.map(i => ({...i}));
  const lines = [];
  for (const row of draftOut.rows) {
    const qty = toNum(row.qty, 0);
    if (!row.itemId) return toast('Semua baris wajib memilih barang!','err');
    if (!qty || qty<=0) return toast('Jumlah di setiap baris harus lebih dari 0!','err');
    const idx = nextItems.findIndex(i => i.id===Number(row.itemId));
    if (idx===-1) return toast('Ada barang yang tidak ditemukan di sistem!','err');
    if (qty>nextItems[idx].stock) return toast(`Stok ${nextItems[idx].name} tidak cukup! Tersedia: ${nextItems[idx].stock} ${nextItems[idx].unit}`,'err');
    nextItems[idx].stock -= qty;
    lines.push({itemId:nextItems[idx].id, name:nextItems[idx].name, category:nextItems[idx].category, qty, unit:nextItems[idx].unit});
  }
  items = nextItems;
  if (recipient && !recipients.map(r=>r.toLowerCase()).includes(recipient.toLowerCase())) recipients.push(recipient);
  outRec.unshift({id:nextId(), date:draftOut.date||today(), recipient, note:draftOut.note.trim(), lines});
  recipients = uniqText(recipients);
  save();
  resetDraftOut();
  toast(`Transaksi barang keluar tersimpan (${lines.length} produk).`);
  render();
};

const submitOpname = () => {
  syncDraftOpFromDom();
  if (!draftOp.reason.trim()) return toast('Alasan opname wajib diisi!','err');
  if (!draftOp.rows.length) return toast('Tambahkan minimal 1 item opname!','err');
  const seen = new Set();
  let nextItems = items.map(i => ({...i}));
  const lines = [];
  for (const row of draftOp.rows) {
    const actualStock = Number(row.actualStock);
    if (!row.itemId) return toast('Semua baris opname wajib memilih barang!','err');
    if (seen.has(String(row.itemId))) return toast('Satu barang tidak boleh diinput dua kali dalam sesi opname!','err');
    seen.add(String(row.itemId));
    if (!Number.isFinite(actualStock) || actualStock<0) return toast('Stok fisik harus 0 atau lebih!','err');
    const current = items.find(i => i.id===Number(row.itemId));
    const idx = nextItems.findIndex(i => i.id===Number(row.itemId));
    if (!current || idx===-1) return toast('Ada barang opname yang tidak ditemukan!','err');
    const diff = actualStock - current.stock;
    nextItems[idx].stock = actualStock;
    lines.push({
      itemId: current.id,
      itemName: current.name,
      category: current.category,
      unit: current.unit,
      systemStock: current.stock,
      actualStock,
      diff
    });
  }
  items = nextItems;
  opRec.unshift({id:nextId(), date:draftOp.date||today(), reason:draftOp.reason.trim(), note:draftOp.note.trim(), lines});
  lines.forEach(line => actLog.unshift({
    id: nextId(),
    ts: new Date().toISOString(),
    type: 'opname',
    itemName: line.itemName,
    systemStock: line.systemStock,
    actualStock: line.actualStock,
    diff: line.diff,
    unit: line.unit,
    reason: draftOp.reason.trim(),
    note: draftOp.note.trim()
  }));
  save();
  resetDraftOp();
  toast(`Sesi stok opname tersimpan (${lines.length} item).`);
  render();
};

const masterList = (title, icon, arr, type, ph) => `
  <div class="panel"><div class="panel-head">${icon} ${title}</div><div class="panel-body">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="ml_${type}" placeholder="contoh: ${ph}" style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0" onkeydown="if(event.key==='Enter')addMaster('${type}')">

    `<div class="tag-list">${arr.map((v,idx)=>`<div class="tag-item">${esc(v)}<button onclick="delMasterAt('${type}',${idx})" title="Hapus">✕</button></div>`).join('')}</div>`}
  </div></div>`;

const addMaster = type => {
  const el = document.getElementById(`ml_${type}`);
  const v  = el.value.trim(); if (!v) return;
  if (type==='cat') {
    if (cats.map(c=>c.toLowerCase()).includes(v.toLowerCase())) return toast('Kategori sudah ada!','warn');
    cats.push(v); toast(`Kategori "${v}" ditambahkan!`);
  } else if (type==='unit') {
    if (units.map(u=>u.toLowerCase()).includes(v.toLowerCase())) return toast('Satuan sudah ada!','warn');
    units.push(v); toast(`Satuan "${v}" ditambahkan!`);
  } else {
    if (getRecipientList().map(r=>r.toLowerCase()).includes(v.toLowerCase())) return toast('Tujuan / penerima sudah ada!','warn');
    recipients.push(v); recipients = uniqText(recipients); toast(`Tujuan / penerima "${v}" ditambahkan!`);
  }
  save(); render();
};

const delMasterAt = (type, idx) => {
  const arr = type==='cat' ? cats : type==='unit' ? units : getRecipientList();
  const v = arr[idx];
  if (v===undefined) return;
  if (type==='cat') {
    if (items.some(i=>i.category===v)) return toast(`Kategori "${v}" masih digunakan!`,'err');
    cats = cats.filter(c=>c!==v); toast(`Kategori "${v}" dihapus.`);
  } else if (type==='unit') {
    if (items.some(i=>i.unit===v)) return toast(`Satuan "${v}" masih digunakan!`,'err');
    units = units.filter(u=>u!==v); toast(`Satuan "${v}" dihapus.`);
  } else {
    if (outRec.some(tx=>tx.recipient===v)) return toast(`Tujuan / penerima "${v}" masih dipakai di transaksi!`,'err');
    recipients = recipients.filter(r=>r!==v); toast(`Tujuan / penerima "${v}" dihapus.`);
  }
  save(); render();
};

  catSel.innerHTML  = cats.map(c=>`<option ${c===it.category?'selected':''}>${esc(c)}</option>`).join('');
  unitSel.innerHTML = units.map(u=>`<option ${u===it.unit?'selected':''}>${esc(u)}</option>`).join('');
  if (!cats.includes(it.category)) catSel.innerHTML += `<option selected>${esc(it.category)}</option>`;
  if (!units.includes(it.unit)) unitSel.innerHTML += `<option selected>${esc(it.unit)}</option>`;
  document.getElementById('editModal').style.display='flex';
};
const closeEdit = () => { document.getElementById('editModal').style.display='none'; editId=null; };
const saveEdit  = () => {
  const name    = document.getElementById('e_name').value.trim();
  const cat     = document.getElementById('e_cat').value;
  const unit    = document.getElementById('e_unit').value;
  const stock   = Number(document.getElementById('e_stock').value);
  const minStock= Number(document.getElementById('e_minstock').value);
  const price   = Number(document.getElementById('e_price').value)||0;
  const reason  = document.getElementById('e_reason').value.trim();
  const note    = document.getElementById('e_note').value.trim();
  if (!name)   return toast('Nama tidak boleh kosong!','err');
  if (!cat || !unit) return toast('Kategori dan satuan wajib diisi!','err');
  if (Number.isNaN(stock) || stock<0) return toast('Stok tidak boleh negatif!','err');
  if (Number.isNaN(minStock) || minStock<0) return toast('Min stok tidak boleh negatif!','err');
  if (price<0) return toast('Harga tidak boleh negatif!','err');
  if (!reason) return toast('Alasan perubahan wajib diisi!','err');
  const orig = items.find(i=>i.id===editId);
  const changes = [];
  if (orig.name!==name)         changes.push(`Nama: "${orig.name}" → "${name}"`);
  if (orig.category!==cat)      changes.push(`Kategori: "${orig.category}" → "${cat}"`);
  if (orig.stock!==stock)       changes.push(`Stok: ${orig.stock} → ${stock}`);
  if (orig.unit!==unit)         changes.push(`Satuan: "${orig.unit}" → "${unit}"`);
  if (orig.minStock!==minStock) changes.push(`Min Stok: ${orig.minStock} → ${minStock}`);
  if ((orig.price||0)!==price)  changes.push(`Harga: ${fmtRp(orig.price||0)} → ${fmtRp(price)}`);
  if (!changes.length) { closeEdit(); return toast('Tidak ada perubahan.','warn'); }
  items = items.map(i=>i.id===editId?{...i,name,category:cat,unit,stock,minStock,price}:i);
  actLog.unshift({id:Date.now(), ts:new Date().toISOString(), type:'edit', itemName:orig.name, changes, reason, note});
  save(); closeEdit(); toast('Barang berhasil diperbarui!'); render();
};

// ── Delete Modal ───────────────────────────────────────────────
const openDel = id => {
  const it = items.find(i=>i.id===id); if (!it) return;
  delId = id;
  document.getElementById('delDesc').innerHTML = `Kamu akan menghapus <strong>"${esc(it.name)}"</strong> (stok: ${it.stock} ${esc(it.unit)}). Tindakan ini tidak bisa dibatalkan.`;
  document.getElementById('del_note').value = '';
  document.getElementById('delModal').style.display='flex';
};
const closeDel = () => { document.getElementById('delModal').style.display='none'; delId=null; };
const confirmDel = () => {
  const note = document.getElementById('del_note').value.trim();
  if (!note) return toast('Keterangan hapus wajib diisi!','err');
  const it = items.find(i=>i.id===delId);
  actLog.unshift({id:Date.now(), ts:new Date().toISOString(), type:'delete', itemName:it.name, stockAtDelete:it.stock, unit:it.unit, reason:note});
  items = items.filter(i=>i.id!==delId);
  save(); closeDel(); toast(`Barang "${it.name}" berhasil dihapus.`); render();
};

// ── Export / Import ────────────────────────────────────────────
const exportData = (format='csv') => {
  if (format==='json') {
    const data = {items,inRec,outRec,opRec,actLog,cats,units,recipients,exportedAt:new Date().toISOString()};
    downloadFile(JSON.stringify(data,null,2), 'application/json', `stockpro_backup_${today()}.json`);
    return toast('Data berhasil diexport ke JSON!');
  }
  const csv = buildCsv(buildCsvRows());
  downloadFile(csv, 'text/csv;charset=utf-8', `stockpro_backup_${today()}.csv`);
  toast('Data berhasil diexport ke CSV!');
};
const importData = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const text = String(ev.target.result || '');
      const trimmed = text.trim();
      const isJson = file.name.toLowerCase().endsWith('.json') || trimmed.startsWith('{') || trimmed.startsWith('[');
      if (isJson) {
        applyImportedState(JSON.parse(text));
        toast('Data JSON berhasil diimport!');
      } else {
        const rows = parseCsv(text);
        if (!rows.length) throw new Error('CSV kosong');
        applyImportedState(parseCsvData(rows));
        toast('Data CSV berhasil diimport!');
      }
    } catch { toast('File tidak valid!','err'); }
  };
  r.readAsText(file);
  e.target.value='';
};

// ── Live search (tanpa full re-render) ────────────────────────
const renderMain = () => {
  const active = document.activeElement;
  const preserveFocus = active && active.closest('#main') ? {
    id: active.id,
    selectionStart: typeof active.selectionStart==='number' ? active.selectionStart : null,
    selectionEnd: typeof active.selectionEnd==='number' ? active.selectionEnd : null
  } : null;
  const pages = { dashboard:pageDashboard, in:pageIn, out:pageOut, opname:pageOpname, summary:pageSummary, manage:pageManage, settings:pageSettings };
  document.getElementById('main').innerHTML = (pages[page]||pageDashboard)();
  if (preserveFocus && preserveFocus.id) {
    const next = document.getElementById(preserveFocus.id);
    if (next) {
      next.focus();
      if (preserveFocus.selectionStart!==null && typeof next.setSelectionRange==='function') {
        next.setSelectionRange(preserveFocus.selectionStart, preserveFocus.selectionEnd ?? preserveFocus.selectionStart);
      }
    }
  }
};

// ── Init ───────────────────────────────────────────────────────
render();
</script>
