<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockPro — Monitoring Stok</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px;outline:none;box-sizing:border-box}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* Layout */
#app{display:flex;min-height:100vh}
aside{width:220px;background:#1e293b;color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:20px;border-bottom:1px solid #334155}
.logo h1{font-size:18px;font-weight:800;color:#fff}
.logo p{font-size:11px;color:#94a3b8;margin-top:2px}
nav{flex:1;padding-top:12px}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 20px;background:transparent;color:#94a3b8;border:none;font-size:14px;text-align:left;transition:.15s}
nav button.active{background:#6366f1;color:#fff;font-weight:700}
.sidebar-footer{padding:14px 20px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:8px}
.sidebar-footer button,.sidebar-footer label{background:#334155;color:#e2e8f0;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;text-align:left;display:block;width:100%}
.sidebar-footer .date{font-size:10px;color:#475569}
main{flex:1;padding:28px;overflow-y:auto}

/* Cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-card .icon{font-size:24px}
.stat-card .val{font-size:26px;font-weight:800;margin-top:6px}
.stat-card .lbl{font-size:12px;color:#64748b;margin-top:2px}
.value-banner{background:linear-gradient(135deg,#1e293b,#334155);border-radius:14px;padding:20px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.value-banner .big{color:#fff;font-size:28px;font-weight:800}
.value-banner .sub{color:#94a3b8;font-size:13px;margin-bottom:4px}
.value-banner .note{color:#64748b;font-size:12px;margin-top:4px}
.value-banner .emoji{font-size:48px;opacity:.2}

/* Panels */
.panel{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px;overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.panel-body{padding:20px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px}
.field textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.new-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:14px;margin-bottom:14px}
.new-box .new-title{font-size:12px;font-weight:700;color:#0369a1;margin-bottom:10px}
.line-builder{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.line-row{border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#f8fafc}
.line-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.line-row-title{font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.04em}
.line-grid{display:grid;grid-template-columns:2fr 1.2fr 1fr;gap:12px}
.line-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.line-grid-4{display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;gap:12px}
.line-remove{background:#fff1f2;border:1px solid #fecdd3;color:#e11d48;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700}
.line-add{background:#eef2ff;color:#4f46e5;border:1px dashed #a5b4fc;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;width:100%}
.batch-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.batch-lines{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.batch-line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.72);border:1px solid #dbeafe}
.batch-line-left{font-size:13px}
.batch-line-name{font-weight:700}
.batch-line-sub{font-size:12px;color:#64748b;margin-top:2px}
.batch-line-right{text-align:right;font-size:12px}
.batch-total{font-size:12px;color:#475569;margin-top:10px;font-weight:700}
.warn-box{background:#fefce8;border:1px solid #fde047;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.warn-box .warn-title{font-size:12px;font-weight:700;color:#854d0e;margin-bottom:8px}
.err-hint{font-size:12px;color:#ef4444;padding:6px 0}
.btn-primary{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:14px;width:100%;margin-top:4px}
.btn-warn{background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:14px;width:100%;margin-top:4px}
.btn-sm{border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700}
.btn-edit{background:#eef2ff;color:#6366f1}
.btn-del{background:#fee2e2;color:#ef4444}
.btn-cancel{padding:9px 18px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600}
.btn-save{padding:9px 18px;border-radius:8px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:700}
.btn-del-confirm{padding:9px 18px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-size:13px;font-weight:700}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-weight:700;color:#475569;font-size:11px;text-transform:uppercase;background:#f8fafc}
td{padding:11px 14px;border-top:1px solid #f1f5f9}
tr:nth-child(even) td{background:#fafafa}

/* Badges */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.badge-ok{background:#dcfce7;color:#16a34a}
.badge-low{background:#fee2e2;color:#ef4444}
.badge-in{background:#22c55e;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-out{background:#f59e0b;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-opname{background:#0ea5e9;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-edit{background:#6366f1;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-del{background:#ef4444;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-audit{background:#0f766e;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.change-chip{font-size:12px;color:#475569;background:#fff;padding:3px 8px;border-radius:6px;display:inline-block;margin:2px;border:1px solid #e2e8f0}

/* History cards */
.hist-card{border-radius:10px;padding:12px 14px;margin-bottom:10px}
.hist-in{background:#f0fdf4;border:1px solid #bbf7d0}
.hist-out{background:#fff7ed;border:1px solid #fed7aa}
.hist-opname{background:#eff6ff;border:1px solid #bfdbfe}
.hist-del{background:#fff1f2;border:1px solid #fecdd3}
.hist-edit{background:#f0f9ff;border:1px solid #bae6fd}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-name{font-weight:700;font-size:14px}
.hist-meta{font-size:12px;color:#64748b;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hist-note{font-size:12px;color:#475569;font-style:italic;margin-top:4px}
.hist-scroll{max-height:480px;overflow-y:auto}

/* Alert */
.alert-low{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:16px 20px}
.alert-low h4{font-weight:700;color:#c2410c;margin-bottom:8px}
.low-chips{display:flex;gap:8px;flex-wrap:wrap}
.low-chip{background:#fed7aa;color:#9a3412;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}

/* Summary cards */
.sum-card{color:#fff;border-radius:14px;padding:20px 24px}
.sum-card .s-lbl{font-size:13px;opacity:.8}
.sum-card .s-val{font-size:30px;font-weight:800}
.sum-card .s-sub{font-size:12px;opacity:.7}

/* Tx row */
.tx-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:10px;margin-bottom:8px}
.tx-row-in{background:#f0fdf4;border:1px solid #bbf7d0}
.tx-row-out{background:#fff7ed;border:1px solid #fed7aa}
.tx-row-opname{background:#eff6ff;border:1px solid #bfdbfe}
.tx-info{flex:1;font-size:13px}
.tx-info .tx-name{font-weight:700}
.tx-info .tx-meta{color:#64748b;font-size:12px}
.tx-right{text-align:right}
.tx-right .tx-amt{font-weight:800;font-size:14px}
.tx-right .tx-date{font-size:11px;color:#94a3b8}
.delta-pos{color:#16a34a}
.delta-neg{color:#ef4444}
.delta-zero{color:#475569}

/* Master list */
.tag-list{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px;padding:5px 12px 5px 14px;font-size:13px}
.tag-item button{background:none;border:none;color:#94a3b8;font-size:14px;padding:0 2px;line-height:1}

@media (max-width:1100px){
  .line-grid,.line-grid-2,.line-grid-4,.batch-meta,.three-col,.two-col,.stat-grid{grid-template-columns:1fr}
}

/* Search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border-radius:8px;border:1px solid #e2e8f0;background:#f8fafc;font-size:13px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;font-size:16px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;padding:28px;width:480px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #f1f5f9}
.modal-title{font-weight:800;font-size:16px}
.modal-close{background:#f1f5f9;border:none;border-radius:8px;width:32px;height:32px;font-size:16px;color:#64748b}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* Toast */
#toast{position:fixed;bottom:20px;right:20px;max-width:min(520px,90vw);z-index:9999;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.18);display:none;color:#fff}

/* Empty */
.empty{text-align:center;color:#94a3b8;padding:40px 0;font-size:13px}

/* Page title */
.page-title{font-size:22px;font-weight:800;margin-bottom:4px}
.page-sub{color:#64748b;font-size:13px;margin-bottom:24px}

mark{background:#fef08a;color:#1e293b;border-radius:2px;padding:0 1px}

/* ── v2: Lot, expired, kartu stok, backup ── */
.stat-grid.stat-6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.line-grid-lot{display:grid;grid-template-columns:2fr 1.6fr 1fr;gap:12px}
.lot-chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;margin:2px 4px 0 0}
.lot-chip.exp-soon{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.lot-chip.exp-past{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.badge-exp-past{background:#fee2e2;color:#b91c1c}
.badge-exp-soon{background:#ffedd5;color:#c2410c}
.badge-exp-ok{background:#dcfce7;color:#16a34a}
.item-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.code-tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#eef2ff;color:#4338ca;padding:1px 6px;border-radius:4px;margin-right:6px}
.backup-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#78350f}
.backup-banner.danger{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d}
.backup-banner .bb-text{flex:1;min-width:220px;line-height:1.5}
.backup-banner button{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700}
.bb-go{background:#f59e0b;color:#fff}
.backup-banner.danger .bb-go{background:#ef4444}
.bb-later{background:transparent;color:inherit;text-decoration:underline}
.sidebar-footer .backup-info{font-size:11px;color:#94a3b8;line-height:1.4}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.toolbar .field{margin-bottom:0;min-width:150px}
.toolbar .grow{flex:1;min-width:240px}
.toolbar .btn-cancel{white-space:nowrap}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px;font-size:13px}
.info-grid .k{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.info-grid .v{font-weight:600;margin-top:2px}
.ks-table td.num,.ks-table th.num{text-align:right;white-space:nowrap}
.ks-table tr.ks-open td,.ks-table tr.ks-total td{background:#f8fafc;font-weight:700}
.print-only{display:none}
.lot-edit-row{display:grid;grid-template-columns:1.2fr 1fr .7fr;gap:8px;align-items:center;font-size:12px;margin-bottom:6px}
.lot-edit-row input{padding:6px 8px;border-radius:6px;border:1px solid #e2e8f0}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11px}
  aside,.no-print,#toast,.overlay{display:none!important}
  #app{display:block}
  main{padding:0}
  .panel{box-shadow:none;border:1px solid #e2e8f0;break-inside:auto}
  .print-only{display:block}
  th,td{padding:5px 8px}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  tr:nth-child(even) td{background:#fff}
  .badge-in,.badge-out,.badge-opname,.badge-edit{background:none!important;color:#1e293b!important;padding:0!important;font-weight:700}
  td.num{color:#1e293b!important}
}
</style>
</head>
<body>
<div id="toast"></div>

<div id="app">
  <aside>
    <div class="logo">
      <h1>📦 StockPro</h1>
      <p>Sistem Monitoring Stok · v2</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <button onclick="exportData('csv')">⬇️ Export CSV</button>
      <label>⬆️ Import CSV / JSON<input type="file" accept=".csv,.json" onchange="importData(event)" style="display:none"></label>
      <button onclick="exportData('json')">🗂️ Export JSON</button>
      <div class="backup-info" id="backupInfo"></div>
      <div class="date" id="dateLabel"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- Edit Modal -->
<div class="overlay" id="editModal" style="display:none">
  <div class="modal">
    <div class="modal-head"><span class="modal-title">✏️ Edit Barang</span><button class="modal-close" onclick="closeEdit()">✕</button></div>
    <div class="field"><label>Nama Barang *</label><input id="e_name"></div>
    <div class="row3">
      <div class="field"><label>Kode Barang</label><input id="e_code" placeholder="SKU / kode internal"></div>
      <div class="field"><label>Merek</label><input id="e_brand"></div>
      <div class="field"><label>No. Izin Edar</label><input id="e_permit" placeholder="AKL / AKD / PKRT"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Kategori</label><select id="e_cat"></select></div>
      <div class="field"><label>Satuan</label><select id="e_unit"></select></div>
    </div>
    <div class="row3">
      <div class="field"><label>Stok</label><input type="number" min="0" id="e_stock"></div>
      <div class="field"><label>Min Stok</label><input type="number" min="0" id="e_minstock"></div>
      <div class="field"><label>Harga (Rp)</label><input type="number" min="0" id="e_price"></div>
    </div>
    <div id="e_lots_wrap" class="field" style="display:none">
      <label>Tanggal Kedaluwarsa per Lot</label>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:6px">Koreksi ED di sini. Jumlah per lot diubah lewat Stok Opname.</div>
      <div id="e_lots"></div>
    </div>
    <div class="warn-box">
      <div class="warn-title">⚠️ Wajib diisi untuk audit trail</div>
      <div class="field"><label>Alasan Perubahan *</label><input id="e_reason" placeholder="contoh: koreksi data, stok opname..."></div>
      <div class="field"><label>Keterangan Tambahan</label><textarea id="e_note" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEdit()">Batal</button>
      <button class="btn-save" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="overlay" id="delModal" style="display:none">
  <div class="modal">
    <div class="modal-head"><span class="modal-title" style="color:#ef4444">🗑️ Hapus Barang</span><button class="modal-close" onclick="closeDel()">✕</button></div>
    <p id="delDesc" style="font-size:13px;color:#475569;margin-bottom:16px"></p>
    <div class="field"><label>Keterangan / Alasan Hapus *</label><textarea id="del_note" rows="3"></textarea></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDel()">Batal</button>
      <button class="btn-del-confirm" onclick="confirmDel()">Hapus</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
const LS = {
  items:'sp_items',
  inRec:'sp_in',
  outRec:'sp_out',
  opRec:'sp_opname',
  actLog:'sp_log',
  cats:'sp_cats',
  units:'sp_units',
  recipients:'sp_recipients',
  settings:'sp_settings',
  lastBackup:'sp_last_backup',
  backupSnooze:'sp_backup_snooze'
};
const DEFAULT_SETTINGS = { companyName:'', expWarnDays:90, backupRemindDays:7 };
const lg = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch { return d; } };
const ls = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

let items      = lg(LS.items, []);
let inRec      = lg(LS.inRec, []);
let outRec     = lg(LS.outRec, []);
let opRec      = lg(LS.opRec, []);
let actLog     = lg(LS.actLog, []);
let cats       = lg(LS.cats, []);
let units      = lg(LS.units, []);
let recipients = lg(LS.recipients, []);
let settings   = {...DEFAULT_SETTINGS, ...lg(LS.settings, {})};
let page       = 'dashboard';
let kartu      = { itemId:'', lot:'', from:'', to:'' };
let editId     = null;
let delId      = null;
let searchSummary = '';
let searchManage  = '';
let seq = Date.now();

const save = () => {
  ls(LS.items,items);
  ls(LS.inRec,inRec);
  ls(LS.outRec,outRec);
  ls(LS.opRec,opRec);
  ls(LS.actLog,actLog);
  ls(LS.cats,cats);
  ls(LS.units,units);
  ls(LS.recipients,recipients);
  ls(LS.settings,settings);
};

// ── Helpers ────────────────────────────────────────────────────
const nextId = () => ++seq;
const pad2  = n => String(n).padStart(2,'0');
const localISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
// Tanggal "YYYY-MM-DD" dibaca sebagai tanggal lokal (bukan UTC) agar tidak bergeser sehari.
const parseYMD = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(s); };
const fmt   = d => parseYMD(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const today = () => localISO(new Date());
const fmtRp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escAttr = s => esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const diffClass = n => n>0 ? 'delta-pos' : n<0 ? 'delta-neg' : 'delta-zero';
const fmtDiff = n => `${n>0?'+':n<0?'':''}${n}`;
const toNum = (v, fallback=0) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const uniqText = arr => [...new Map((Array.isArray(arr)?arr:[])
  .map(v => String(v||'').trim())
  .filter(Boolean)
  .map(v => [v.toLowerCase(), v])).values()];

const fuzzy = (str, pat) => {
  if (!pat) return true;
  const s=str.toLowerCase(), p=pat.toLowerCase(); let pi=0;
  for (let i=0;i<s.length&&pi<p.length;i++) if(s[i]===p[pi]) pi++;
  return pi===p.length;
};

const hl = (text, query) => {
  if (!query) return esc(text);
  const s=text.toLowerCase(), p=query.toLowerCase();
  const used=new Set(); let pi=0;
  for (let i=0;i<s.length&&pi<p.length;i++) if(s[i]===p[pi]){used.add(i);pi++;}
  return [...text].map((ch,i) => used.has(i)?`<mark>${esc(ch)}</mark>`:esc(ch)).join('');
};

// ── Lot / Batch & Kedaluwarsa ──────────────────────────────────
// Setiap barang punya stok total (it.stock) dan daftar lot (it.lots: {lot, exp, qty}).
// Selisih stok total dikurangi jumlah semua lot = stok "tanpa lot" (data lama / barang non-lot).
const NO_LOT = '__none__';
const sumLots   = it => (it.lots||[]).reduce((s,l)=>s+l.qty,0);
const unlotted  = it => Math.max(0, it.stock - sumLots(it));
const expKey    = l => l.exp || '9999-12-31';
const sortLots  = lots => [...lots].sort((a,b)=>expKey(a).localeCompare(expKey(b)) || a.lot.localeCompare(b.lot));
const daysTo    = exp => exp ? Math.round((parseYMD(exp) - parseYMD(today()))/86400000) : null;
const expState  = exp => { const d=daysTo(exp); if (d===null) return 'none'; if (d<0) return 'past'; if (d<=settings.expWarnDays) return 'soon'; return 'ok'; };
const expLabel  = exp => { const d=daysTo(exp); if (d===null) return ''; if (d<0) return `lewat ${-d} hari`; if (d===0) return 'hari ini'; return `${d} hari lagi`; };
const lotText   = l => `${l.lot || 'Tanpa lot'}${l.exp?` · ED ${fmt(l.exp)}`:''}`;
const lotChip   = (l, withQty, unit='') => { const st=expState(l.exp); return `<span class="lot-chip ${st==='past'?'exp-past':st==='soon'?'exp-soon':''}" title="${escAttr(expLabel(l.exp))}">🏷️ ${esc(lotText(l))}${withQty?` · ${l.qty} ${esc(unit)}`:''}</span>`; };
const nearestExp = it => sortLots((it.lots||[]).filter(l=>l.exp && l.qty>0))[0] || null;
const itemLabel = (i, word='Stok') => `${i.code?`[${i.code}] `:''}${i.name} (${word}: ${i.stock} ${i.unit})`;

// Terima tanggal YYYY-MM-DD, DD/MM/YYYY, atau DD-MM-YYYY (umum di Excel Indonesia)
const normDate = v => {
  const s = String(v||'').trim();
  if (!s) return '';
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);
  if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return null; // tidak valid
};

// Tambah stok ke lot (dipakai Barang Masuk). Mutasi item salinan.
const addToLot = (it, lot, exp, qty) => {
  it.stock += qty;
  if (!lot) return;
  it.lots = it.lots || [];
  const ex = it.lots.find(l => l.lot.toLowerCase()===lot.toLowerCase());
  if (ex) {
    if (exp && ex.exp && ex.exp!==exp) throw new Error(`Lot ${lot} untuk ${it.name} sudah tercatat dengan ED ${fmt(ex.exp)}, berbeda dengan ${fmt(exp)}.`);
    ex.qty += qty;
    if (exp && !ex.exp) ex.exp = exp;
  } else {
    it.lots.push({lot, exp:exp||'', qty});
  }
};

// Kurangi stok (Barang Keluar). lotSel: '' = otomatis FEFO, NO_LOT = stok tanpa lot, atau kode lot.
// Mengembalikan alokasi [{lot, exp, qty}]. Melempar Error jika stok tidak cukup.
const allocateOut = (it, qty, lotSel) => {
  it.lots = (it.lots||[]).map(l=>({...l}));
  let alloc = [];
  if (lotSel===NO_LOT) {
    if (qty > unlotted(it)) throw new Error(`Stok tanpa lot ${it.name} tidak cukup (tersedia ${unlotted(it)} ${it.unit}).`);
    alloc = [{lot:'', exp:'', qty}];
  } else if (lotSel) {
    const l = it.lots.find(x => x.lot===lotSel);
    if (!l) throw new Error(`Lot ${lotSel} tidak ditemukan pada ${it.name}.`);
    if (qty > l.qty) throw new Error(`Lot ${lotSel} ${it.name} hanya tersisa ${l.qty} ${it.unit}.`);
    l.qty -= qty;
    alloc = [{lot:l.lot, exp:l.exp, qty}];
  } else {
    // FEFO: ED terdekat dulu, lot expired dilewati, lalu lot tanpa ED, lalu stok tanpa lot.
    const usable = sortLots(it.lots.filter(l => l.qty>0 && expState(l.exp)!=='past'));
    const avail = usable.reduce((s,l)=>s+l.qty,0) + unlotted(it);
    if (qty > avail) {
      const expiredQty = it.stock - avail;
      throw new Error(expiredQty>0
        ? `Stok ${it.name} yang belum kedaluwarsa hanya ${avail} ${it.unit} (${expiredQty} ${it.unit} sudah expired). Pilih lot secara manual bila memang mengeluarkan barang expired (retur/pemusnahan).`
        : `Stok ${it.name} tidak cukup! Tersedia: ${it.stock} ${it.unit}`);
    }
    let rem = qty;
    for (const u of usable) {
      if (!rem) break;
      const l = it.lots.find(x=>x.lot===u.lot);
      const take = Math.min(rem, l.qty);
      l.qty -= take; rem -= take;
      alloc.push({lot:l.lot, exp:l.exp, qty:take});
    }
    if (rem) alloc.push({lot:'', exp:'', qty:rem});
  }
  it.stock -= qty;
  it.lots = it.lots.filter(l => l.qty>0);
  return alloc;
};

// Opname. lotSel: '' = total barang, NO_LOT = bagian tanpa lot, atau kode lot. Mengembalikan stok sistem sebelum opname.
const applyOpname = (it, actual, lotSel) => {
  it.lots = (it.lots||[]).map(l=>({...l}));
  let system;
  if (!lotSel) {
    const minTotal = sumLots(it);
    if (actual < minTotal) throw new Error(`Stok fisik ${it.name} (${actual}) lebih kecil dari total lot tercatat (${minTotal}). Lakukan opname per lot.`);
    system = it.stock;
    it.stock = actual;
  } else if (lotSel===NO_LOT) {
    system = unlotted(it);
    it.stock += actual - system;
  } else {
    const l = it.lots.find(x=>x.lot===lotSel);
    if (!l) throw new Error(`Lot ${lotSel} tidak ditemukan pada ${it.name}.`);
    system = l.qty;
    l.qty = actual;
    it.stock += actual - system;
  }
  it.lots = it.lots.filter(l => l.qty>0);
  return system;
};

const lotSelectOptions = (it, selected, mode) => {
  // mode 'out' → default FEFO; mode 'op' → default total
  if (!it) return `<option value="">${mode==='out'?'Otomatis (FEFO)':'Total barang'}</option>`;
  const opts = [`<option value="" ${selected===''?'selected':''}>${mode==='out'?'Otomatis — ED terdekat dulu (FEFO)':`Total barang (${it.stock} ${esc(it.unit)})`}</option>`];
  sortLots(it.lots||[]).forEach(l => {
    const st = expState(l.exp);
    opts.push(`<option value="${escAttr(l.lot)}" ${selected===l.lot?'selected':''}>${st==='past'?'⛔ EXPIRED · ':st==='soon'?'⚠️ ':''}${esc(lotText(l))} · sisa ${l.qty}</option>`);
  });
  if ((it.lots||[]).length && unlotted(it)>0) opts.push(`<option value="${NO_LOT}" ${selected===NO_LOT?'selected':''}>Tanpa lot · sisa ${unlotted(it)}</option>`);
  return opts.join('');
};

const getLotRows = () => items.flatMap(it => (it.lots||[]).filter(l=>l.qty>0).map(l => ({it, ...l, days:daysTo(l.exp), state:expState(l.exp)})));

// ── Export Excel (.xlsx) tanpa library ─────────────────────────
const CRC_TABLE = (() => { const t=new Uint32Array(256); for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;} return t; })();
const crc32 = b => { let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_TABLE[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
const zipStore = files => {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = typeof f.data==='string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,size,true);
    lh.setUint32(22,size,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((s,p)=>s+p.length,0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
};
const xmlEsc = s => String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName = i => { let s=''; i++; while(i>0){const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; };
// rows: array of arrays; cell = nilai biasa atau {v, bold:true}. widths: lebar kolom (karakter).
const downloadXlsx = (filename, sheetName, rows, widths=[]) => {
  const sheetRows = rows.map((row, r) => `<row r="${r+1}">${row.map((cell, c) => {
    const o = (cell && typeof cell==='object') ? cell : {v:cell};
    const ref = `${colName(c)}${r+1}`, s = o.bold ? ' s="1"' : '';
    if (o.v===null || o.v===undefined || o.v==='') return o.bold ? `<c r="${ref}"${s}/>` : '';
    if (typeof o.v==='number' && Number.isFinite(o.v)) return `<c r="${ref}"${s}><v>${o.v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xmlEsc(o.v)}</t></is></c>`;
  }).join('')}</row>`).join('');
  const cols = widths.length ? `<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
  const safeName = xmlEsc(String(sheetName).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31) || 'Sheet1');
  const files = [
    {name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${safeName}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
    {name:'xl/worksheets/sheet1.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${sheetRows}</sheetData></worksheet>`},
  ];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipStore(files));
  a.download = filename;
  a.click();
};

const CSV_HEADERS = [
  'record_type','audit_type','key','value','id','batch_id','line_index','date','ts',
  'item_id','name','category','qty','unit','price','supplier','recipient','reason','note',
  'stock','min_stock','system_stock','actual_stock','diff','changes_json',
  'code','brand','permit_no','lot','exp','alloc_json','extra_json'
];

const csvCell = v => {
  const s = String(v ?? '');
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
};

const buildCsv = rows => [
  CSV_HEADERS.map(csvCell).join(','),
  ...rows.map(row => CSV_HEADERS.map(h => csvCell(row[h] ?? '')).join(','))
].join('\r\n');

const detectDelim = text => { const first=(String(text).split(/\r?\n/)[0]||''); return (!first.includes(',') && first.includes(';')) ? ';' : ','; };
const parseCsv = (text, delim=',') => {
  const rows = [];
  let row = [];
  let cell = '';
  let i = 0;
  let inQuotes = false;
  while (i < text.length) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i+1] === '"') { cell += '"'; i += 2; continue; }
        inQuotes = false;
      } else cell += ch;
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === delim) {
      row.push(cell); cell = '';
    } else if (ch === '\n') {
      row.push(cell); rows.push(row); row = []; cell = '';
    } else if (ch !== '\r') {
      cell += ch;
    }
    i++;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows.shift().map(h => h.replace(/^\uFEFF/,'').trim());
  return rows
    .filter(cols => cols.some(col => String(col).trim() !== ''))
    .map(cols => Object.fromEntries(headers.map((h, idx) => [h, cols[idx] ?? ''])));
};

const downloadFile = (content, type, filename) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = filename;
  a.click();
};

  actLog.forEach(a => rows.push({
    record_type:'audit', audit_type:a.type, id:a.id, ts:a.ts, name:a.itemName, unit:a.unit||'', reason:a.reason||'', note:a.note||'',
    stock:a.stockAtDelete ?? '', system_stock:a.systemStock ?? '', actual_stock:a.actualStock ?? '', diff:a.diff ?? '',
    changes_json: JSON.stringify(a.changes||[]),
    extra_json: JSON.stringify({itemId:a.itemId, stockBefore:a.stockBefore, stockAfter:a.stockAfter, lot:a.lot})
  }));
  return rows;
};

const parseCsvData = rows => {
  const nextState = { items:[], inRec:[], outRec:[], opRec:[], actLog:[], cats:[], units:[], recipients:[] };
  const inMap = new Map(), outMap = new Map(), opMap = new Map();
  const lotRows = [];
  const parseJson = (s, d) => { try { return s ? JSON.parse(s) : d; } catch { return d; } };
  rows.forEach(row => {
    const type = String(row.record_type||'').trim();
    if (type==='meta' && row.key==='settings') {
      nextState.settings = parseJson(row.value, undefined);
    } else if (type==='item') {
      nextState.items.push({
        id: toNum(row.id, nextId()),
        name: row.name,
        category: row.category,
        stock: toNum(row.stock, 0),
        unit: row.unit,
        minStock: toNum(row.min_stock, 0),
        price: toNum(row.price, 0),
        code: row.code || '',
        brand: row.brand || '',
        permitNo: row.permit_no || '',
        lots: []
      });
    } else if (type==='lot') {
      lotRows.push(row);
    } else if (type==='master') {
      if (row.key==='cat') nextState.cats.push(row.value);
      if (row.key==='unit') nextState.units.push(row.value);
      if (row.key==='recipient') nextState.recipients.push(row.value);
    } else if (type==='in_line') {
      const id = toNum(row.batch_id, nextId());
      if (!inMap.has(id)) inMap.set(id, { id, date: row.date || today(), supplier: row.supplier || '', note: row.note || '', lines: [] });
      inMap.get(id).lines.push({
        itemId: row.item_id==='' ? null : toNum(row.item_id, null),
        name: row.name,
        category: row.category,
        qty: toNum(row.qty, 0),
        unit: row.unit,
        price: toNum(row.price, 0),
        lot: row.lot || '',
        exp: row.exp || ''
      });
    } else if (type==='out_line') {
      const id = toNum(row.batch_id, nextId());
      if (!outMap.has(id)) outMap.set(id, { id, date: row.date || today(), recipient: row.recipient || '', note: row.note || '', lines: [] });
      outMap.get(id).lines.push({
        itemId: row.item_id==='' ? null : toNum(row.item_id, null),
        name: row.name,
        category: row.category,
        qty: toNum(row.qty, 0),
        unit: row.unit,
        alloc: parseJson(row.alloc_json, undefined)
      });
    } else if (type==='op_line') {
      const id = toNum(row.batch_id, nextId());
      if (!opMap.has(id)) opMap.set(id, { id, date: row.date || today(), reason: row.reason || '', note: row.note || '', lines: [] });
      opMap.get(id).lines.push({
        itemId: row.item_id==='' ? null : toNum(row.item_id, null),
        itemName: row.name,
        category: row.category,
        unit: row.unit,
        systemStock: toNum(row.system_stock, 0),
        actualStock: toNum(row.actual_stock, 0),
        diff: toNum(row.diff, 0),
        lot: row.lot || '',
        exp: row.exp || ''
      });
    } else if (type==='audit') {
      let changes = [];
      try { changes = JSON.parse(row.changes_json || '[]'); } catch {}
      const extra = parseJson(row.extra_json, {}) || {};
      nextState.actLog.push({
        itemId: extra.itemId,
        stockBefore: extra.stockBefore,
        stockAfter: extra.stockAfter,
        lot: extra.lot,
        id: toNum(row.id, nextId()),
        ts: row.ts || new Date().toISOString(),
        type: row.audit_type || 'edit',
        itemName: row.name || '',
        unit: row.unit || '',
        reason: row.reason || '',
        note: row.note || '',
        stockAtDelete: row.stock==='' ? undefined : toNum(row.stock, 0),
        systemStock: row.system_stock==='' ? undefined : toNum(row.system_stock, 0),
        actualStock: row.actual_stock==='' ? undefined : toNum(row.actual_stock, 0),
        diff: row.diff==='' ? undefined : toNum(row.diff, 0),
        changes: Array.isArray(changes) ? changes : []
      });
    }
  });
  lotRows.forEach(row => {
    const it = nextState.items.find(i => String(i.id)===String(row.item_id));
    if (it) it.lots.push({lot: row.lot || '', exp: row.exp || '', qty: toNum(row.qty, 0)});
  });
  nextState.inRec = [...inMap.values()];
  nextState.outRec = [...outMap.values()];
  nextState.opRec = [...opMap.values()];
  return nextState;
};

const applyImportedState = data => {
  if(Array.isArray(data.items)) items = data.items;
  if(Array.isArray(data.inRec)) inRec = data.inRec;
  if(Array.isArray(data.outRec)) outRec = data.outRec;
  if(Array.isArray(data.opRec)) opRec = data.opRec;
  if(Array.isArray(data.actLog)) actLog = data.actLog;
  if(Array.isArray(data.cats)) cats = data.cats;
  if(Array.isArray(data.units)) units = data.units;
  if(Array.isArray(data.recipients)) recipients = data.recipients;
  if(data.settings && typeof data.settings==='object') settings = {...DEFAULT_SETTINGS, ...data.settings};
  normalizeState();
  resetDraftIn();
  resetDraftOut();
  resetDraftOp();
  save();
  render();
};

const BULK_HEADERS = {
  in: ['kode_transaksi','tanggal','supplier','tipe_barang','kode_barang','nama_barang_existing','nama_barang_baru','kategori_barang_baru','satuan_barang_baru','merek_barang_baru','izin_edar_barang_baru','lot','tanggal_kedaluwarsa','jumlah','harga_satuan','keterangan'],
  out: ['kode_transaksi','tanggal','tujuan_penerima','kode_barang','nama_barang','lot','jumlah','keterangan','stok_saat_ini','satuan'],
  opname: ['kode_sesi','tanggal','alasan_opname','kode_barang','nama_barang','lot','tanggal_kedaluwarsa','stok_sistem','stok_fisik','satuan','catatan']
};

const bulkCell = (row, key) => String(row[key] ?? '').trim();
const groupByKey = (rows, keyName) => {
  const map = new Map();
  rows.forEach((row, idx) => {
    const key = bulkCell(row, keyName) || `${keyName || 'group'}_${idx+1}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  });
  return [...map.entries()];
};

// Cari barang: kode_barang lebih diutamakan, lalu nama (+ satuan/kategori bila diisi).
const findItemIdx = (list, {code='', name='', unit='', category=''}) => {
  const c = code.trim().toLowerCase(), n = name.trim().toLowerCase(), u = unit.trim().toLowerCase(), k = category.trim().toLowerCase();
  if (c) {
    const byCode = list.findIndex(it => (it.code||'').toLowerCase()===c);
    if (byCode!==-1) return byCode;
  }
  if (!n) return -1;
  return list.findIndex(it =>
    it.name.toLowerCase()===n &&
    (!k || it.category.toLowerCase()===k) &&
    (!u || it.unit.toLowerCase()===u)
  );
};

const bulkDate = (row, key, label) => {
  const raw = bulkCell(row, key);
  const d = normDate(raw);
  if (d===null) throw new Error(`${label}: format tanggal "${raw}" tidak dikenali. Gunakan YYYY-MM-DD atau DD/MM/YYYY.`);
  return d;
};

const buildBulkTemplateRows = type => {
  if (type==='in') {
    const base = items.length ? items.map((it, idx) => ({
      kode_transaksi: idx<2 ? `IN-${today()}-A` : `IN-${today()}-R${idx+1}`,
      tanggal: today(),
      supplier: '',
      tipe_barang: 'existing',
      kode_barang: it.code || '',
      nama_barang_existing: it.name,
      lot: '',
      tanggal_kedaluwarsa: '',
      jumlah: '',
      harga_satuan: it.price || '',
      keterangan: ''
    })) : [{
      kode_transaksi: `IN-${today()}-A`,
      tanggal: today(),
      supplier: 'PT Contoh Supplier',
      tipe_barang: 'existing',
      nama_barang_existing: 'Contoh Barang',
      jumlah: '',
      keterangan: 'isi jumlah lalu import'
    }];
    return base.concat([{
      kode_transaksi: `IN-${today()}-BARU`,
      tanggal: today(),
      tipe_barang: 'baru',
      kategori_barang_baru: cats[0] || '',
      satuan_barang_baru: units[0] || '',
      keterangan: 'tambahkan baris baru untuk barang yang belum ada'
    }]);
  }
  if (type==='out') {
    return (items.length ? items : [{name:'Contoh Barang',stock:0,unit:units[0]||'pcs'}]).map((it, idx) => ({
      kode_transaksi: idx<2 ? `OUT-${today()}-A` : `OUT-${today()}-R${idx+1}`,
      tanggal: today(),
      tujuan_penerima: '',
      kode_barang: it.code || '',
      nama_barang: it.name,
      lot: '',
      jumlah: '',
      keterangan: '',
      stok_saat_ini: it.stock ?? '',
      satuan: it.unit || ''
    }));
  }
  // Opname: satu baris per lot (jika ada), plus baris stok tanpa lot.
  const src = items.length ? items : [{name:'Contoh Barang',stock:0,unit:units[0]||'pcs',lots:[]}];
  const rows = [];
  src.forEach(it => {
    const lots = sortLots(it.lots||[]);
    if (!lots.length) {
      rows.push({nama_barang:it.name, kode_barang:it.code||'', lot:'', stok_sistem:it.stock ?? '', satuan:it.unit||''});
    } else {
      lots.forEach(l => rows.push({nama_barang:it.name, kode_barang:it.code||'', lot:l.lot, tanggal_kedaluwarsa:l.exp, stok_sistem:l.qty, satuan:it.unit||''}));
      if (unlotted(it)>0) rows.push({nama_barang:it.name, kode_barang:it.code||'', lot:'(tanpa lot)', stok_sistem:unlotted(it), satuan:it.unit||''});
    }
  });
  return rows.map((r, idx) => ({
    kode_sesi: `OP-${today()}-A`,
    tanggal: today(),
    alasan_opname: idx===0 ? 'stok opname bulanan' : '',
    stok_fisik: '',
    catatan: '',
    ...r
  }));
};

const downloadBulkTemplate = type => {
  const headers = BULK_HEADERS[type];
  if (!headers) return;
  const rows = buildBulkTemplateRows(type);
  const csv = [
    headers.map(csvCell).join(','),
    ...rows.map(row => headers.map(h => csvCell(row[h] ?? '')).join(','))
  ].join('\r\n');
  const name = type==='in' ? 'barang_masuk' : type==='out' ? 'barang_keluar' : 'stok_opname';
  downloadFile(csv, 'text/csv;charset=utf-8', `template_${name}_${today()}.csv`);
  toast(`Template CSV ${name.replace(/_/g,' ')} berhasil didownload.`);
};

const getCsvGuideUrl = () => new URL('panduan_bulk_import_csv.md', window.location.href).href;
const openCsvGuide = () => {
  window.location.assign(getCsvGuideUrl());
};

const importBulkCsv = (e, type) => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      // Dukung CSV dari Excel Indonesia yang memakai titik koma sebagai pemisah
      const text = String(ev.target.result || '').replace(/^﻿/, '');
      const rows = parseCsv(text, detectDelim(text));
      if (!rows.length) throw new Error('CSV kosong');
      if (type==='in') importBulkInRows(rows);
      else if (type==='out') importBulkOutRows(rows);
      else if (type==='opname') importBulkOpRows(rows);
      else throw new Error('Tipe import tidak dikenali');
    } catch (err) {
      toast(err && err.message ? err.message : 'File bulk CSV tidak valid!','err');
    } finally {
      e.target.value = '';
    }
  };
  r.readAsText(file);
};

const inRowName = r => bulkCell(r,'nama_barang_existing') || bulkCell(r,'nama_barang_baru') || bulkCell(r,'nama_barang') || bulkCell(r,'kode_barang');

const importBulkInRows = rows => {
  let nextItems = items.map(i => ({...i, lots:(i.lots||[]).map(l=>({...l}))}));
  const txList = [];
  for (const [code, group] of groupByKey(rows.filter(r => inRowName(r) || bulkCell(r,'jumlah')), 'kode_transaksi')) {
    const validRows = group.filter(r => inRowName(r) && bulkCell(r,'jumlah'));
    if (!validRows.length) continue;
    const supplier = bulkCell(validRows[0],'supplier');
    const note = bulkCell(validRows[0],'keterangan');
    const date = bulkDate(validRows[0],'tanggal',`CSV masuk ${code}`) || today();
    const lines = [];
    validRows.forEach((row, idx) => {
      const typeRaw = bulkCell(row,'tipe_barang').toLowerCase();
      const isNew = typeRaw === 'baru' || (!bulkCell(row,'nama_barang_existing') && !!bulkCell(row,'nama_barang_baru'));
      const itemCode = bulkCell(row,'kode_barang');
      const name = isNew ? bulkCell(row,'nama_barang_baru') : (bulkCell(row,'nama_barang_existing') || bulkCell(row,'nama_barang'));
      const category = isNew ? bulkCell(row,'kategori_barang_baru') : bulkCell(row,'kategori');
      const unit = isNew ? bulkCell(row,'satuan_barang_baru') : bulkCell(row,'satuan');
      const qty = toNum(bulkCell(row,'jumlah'), 0);
      const priceRaw = bulkCell(row,'harga_satuan');
      const price = priceRaw==='' ? null : toNum(priceRaw, NaN);
      const lot = bulkCell(row,'lot');
      const exp = bulkDate(row,'tanggal_kedaluwarsa',`CSV masuk ${code} baris ${idx+1}`);
      if (!name && !itemCode) throw new Error(`CSV masuk: nama barang kosong pada batch ${code}, baris ${idx+1}`);
      if (!qty || qty<=0) throw new Error(`CSV masuk: jumlah tidak valid untuk ${name||itemCode}`);
      if (price!==null && !Number.isFinite(price)) throw new Error(`CSV masuk: harga_satuan tidak valid untuk ${name||itemCode}`);
      let itemIdx = findItemIdx(nextItems, {code:itemCode, name, unit, category});
      if (itemIdx===-1) {
        if (!isNew) throw new Error(`CSV masuk: barang "${name||itemCode}" tidak ditemukan. Untuk barang baru isi tipe_barang = baru.`);
        if (!name || !category || !unit) throw new Error(`CSV masuk: barang baru "${name}" wajib isi nama, kategori, dan satuan`);
        itemIdx = nextItems.push({id:nextId(), name, category, stock:0, unit, minStock:10, price:0,
          code:itemCode, brand:bulkCell(row,'merek_barang_baru'), permitNo:bulkCell(row,'izin_edar_barang_baru'), lots:[]}) - 1;
      }
      const it = nextItems[itemIdx];
      const finalPrice = price===null ? (it.price||0) : price;
      addToLot(it, lot, exp, qty);
      it.price = finalPrice;
      lines.push({itemId:it.id, name:it.name, category:it.category, qty, unit:it.unit, price:finalPrice, lot, exp: lot ? ((it.lots.find(l=>l.lot.toLowerCase()===lot.toLowerCase())||{}).exp||exp) : ''});
    });
    txList.push({id:nextId(), date, supplier, note, lines});
  }
  if (!txList.length) throw new Error('CSV masuk tidak punya baris transaksi yang bisa diproses (cek kolom nama barang dan jumlah)');
  items = nextItems;
  inRec = [...txList.reverse(), ...inRec];
  resetDraftIn();
  save();
  render();
  toast(`Bulk import barang masuk berhasil (${txList.length} transaksi).`);
};

const importBulkOutRows = rows => {
  let nextItems = items.map(i => ({...i, lots:(i.lots||[]).map(l=>({...l}))}));
  const txList = [];
  const nextRecipients = [...recipients];
  const rowName = r => bulkCell(r,'nama_barang') || bulkCell(r,'kode_barang');
  for (const [code, group] of groupByKey(rows.filter(r => rowName(r) || bulkCell(r,'jumlah')), 'kode_transaksi')) {
    const validRows = group.filter(r => rowName(r) && bulkCell(r,'jumlah'));
    if (!validRows.length) continue;
    const recipient = bulkCell(validRows[0],'tujuan_penerima');
    const note = bulkCell(validRows[0],'keterangan');
    const date = bulkDate(validRows[0],'tanggal',`CSV keluar ${code}`) || today();
    const lines = [];
    validRows.forEach((row, idx) => {
      const name = bulkCell(row,'nama_barang');
      const itemCode = bulkCell(row,'kode_barang');
      const unit = bulkCell(row,'satuan');
      const qty = toNum(bulkCell(row,'jumlah'), 0);
      const lotRaw = bulkCell(row,'lot');
      if (!qty || qty<=0) throw new Error(`CSV keluar: jumlah tidak valid untuk ${name||itemCode}`);
      const itemIdx = findItemIdx(nextItems, {code:itemCode, name, unit});
      if (itemIdx===-1) throw new Error(`CSV keluar: barang "${name||itemCode}" tidak ditemukan`);
      const it = nextItems[itemIdx];
      const lotSel = !lotRaw ? '' : /^\(?tanpa lot\)?$/i.test(lotRaw) ? NO_LOT : ((it.lots||[]).find(l=>l.lot.toLowerCase()===lotRaw.toLowerCase())||{lot:lotRaw}).lot;
      let alloc;
      try { alloc = allocateOut(it, qty, lotSel); }
      catch (err) { throw new Error(`CSV keluar (${code}): ${err.message}`); }
      lines.push({itemId:it.id, name:it.name, category:it.category, qty, unit:it.unit, alloc});
    });
    txList.push({id:nextId(), date, recipient, note, lines});
    if (recipient && !nextRecipients.map(r=>r.toLowerCase()).includes(recipient.toLowerCase())) nextRecipients.push(recipient);
  }
  if (!txList.length) throw new Error('CSV keluar tidak punya baris transaksi yang bisa diproses');
  items = nextItems;
  recipients = uniqText(nextRecipients);
  outRec = [...txList.reverse(), ...outRec];
  resetDraftOut();
  save();
  render();
  toast(`Bulk import barang keluar berhasil (${txList.length} transaksi).`);
};

const importBulkOpRows = rows => {
  let nextItems = items.map(i => ({...i, lots:(i.lots||[]).map(l=>({...l}))}));
  const txList = [];
  const newLogs = [];
  const rowName = r => bulkCell(r,'nama_barang') || bulkCell(r,'kode_barang');
  for (const [code, group] of groupByKey(rows.filter(r => rowName(r) || bulkCell(r,'stok_fisik')), 'kode_sesi')) {
    const validRows = group.filter(r => rowName(r) && bulkCell(r,'stok_fisik'));
    if (!validRows.length) continue;
    const reason = bulkCell(validRows[0],'alasan_opname');
    const note = bulkCell(validRows[0],'catatan');
    const date = bulkDate(validRows[0],'tanggal',`CSV opname ${code}`) || today();
    if (!reason) throw new Error(`CSV opname: alasan_opname wajib diisi untuk sesi ${code}`);
    const seen = new Set();
    const lines = [];
    validRows.forEach((row, idx) => {
      const name = bulkCell(row,'nama_barang');
      const itemCode = bulkCell(row,'kode_barang');
      const unit = bulkCell(row,'satuan');
      const actual = toNum(bulkCell(row,'stok_fisik'), NaN);
      const lotRaw = bulkCell(row,'lot');
      if (!Number.isFinite(actual) || actual<0) throw new Error(`CSV opname: stok_fisik tidak valid untuk ${name||itemCode}`);
      const itemIdx = findItemIdx(nextItems, {code:itemCode, name, unit});
      if (itemIdx===-1) throw new Error(`CSV opname: barang "${name||itemCode}" tidak ditemukan`);
      const it = nextItems[itemIdx];
      const hasLots = (it.lots||[]).length>0;
      let lotSel = '';
      let lotExp = '';
      if (lotRaw) {
        if (/^\(?tanpa lot\)?$/i.test(lotRaw)) lotSel = NO_LOT;
        else {
          const ex = (it.lots||[]).find(l=>l.lot.toLowerCase()===lotRaw.toLowerCase());
          if (ex) { lotSel = ex.lot; lotExp = ex.exp; }
          else {
            // Lot ditemukan saat hitung fisik tapi belum tercatat: buat lot baru dengan stok sistem 0
            const exp = bulkDate(row,'tanggal_kedaluwarsa',`CSV opname ${code} baris ${idx+1}`);
            it.lots = [...(it.lots||[]), {lot:lotRaw, exp, qty:0}];
            lotSel = lotRaw; lotExp = exp;
          }
        }
      } else if (hasLots) lotSel = '';
      const key = `${it.id}|${lotSel}`;
      if (seen.has(key)) throw new Error(`CSV opname: barang "${it.name}"${lotSel?` lot ${lotSel}`:''} dobel dalam satu sesi`);
      seen.add(key);
      let systemStock;
      try { systemStock = applyOpname(it, actual, lotSel); }
      catch (err) { throw new Error(`CSV opname (${code}): ${err.message}`); }
      const diff = actual - systemStock;
      const lotOut = lotSel===NO_LOT ? '' : lotSel;
      lines.push({itemId:it.id, itemName:it.name, category:it.category, unit:it.unit, systemStock, actualStock:actual, diff, lot:lotOut, lotMode: lotSel===NO_LOT ? 'none' : lotSel ? 'lot' : 'total', exp:lotExp});
      newLogs.push({id:nextId(), ts:new Date().toISOString(), type:'opname', itemId:it.id, itemName:it.name, systemStock, actualStock:actual, diff, unit:it.unit, reason, note, lot:lotOut});
    });
    txList.push({id:nextId(), date, reason, note, lines});
  }
  if (!txList.length) throw new Error('CSV opname tidak punya baris sesi yang bisa diproses');
  items = nextItems;
  opRec = [...txList.reverse(), ...opRec];
  actLog = [...newLogs.reverse(), ...actLog];
  resetDraftOp();
  save();
  render();
  toast(`Bulk import stok opname berhasil (${txList.length} sesi).`);
};

const normalizeItems = arr => (Array.isArray(arr)?arr:[]).map(it => ({
  id: toNum(it.id, nextId()),
  name: String(it.name||'').trim(),
  category: String(it.category||'').trim(),
  stock: Math.max(0, toNum(it.stock, 0)),
  unit: String(it.unit||'').trim(),
  minStock: Math.max(0, toNum(it.minStock, 0)),
  price: Math.max(0, toNum(it.price, 0)),
  code: String(it.code||'').trim(),
  brand: String(it.brand||'').trim(),
  permitNo: String(it.permitNo||'').trim(),
  lots: (Array.isArray(it.lots)?it.lots:[])
    .map(l => ({lot:String(l.lot||'').trim(), exp:normDate(l.exp)||'', qty:Math.max(0, toNum(l.qty,0))}))
    .filter(l => l.lot && l.qty>0)
})).filter(it => it.name).map(it => {
  // Jaga konsistensi: stok total tidak boleh lebih kecil dari jumlah lot
  const lotSum = sumLots(it);
  if (it.stock < lotSum) it.stock = lotSum;
  return it;
});

const normalizeInLine = line => ({
  itemId: line.itemId===undefined || line.itemId===null || line.itemId==='' ? null : toNum(line.itemId, null),
  name: String(line.name||line.itemName||'').trim(),
  category: String(line.category||'').trim(),
  qty: Math.max(0, toNum(line.qty, 0)),
  unit: String(line.unit||'').trim(),
  price: Math.max(0, toNum(line.price, 0)),
  lot: String(line.lot||'').trim(),
  exp: normDate(line.exp)||''
});
const normalizeOutLine = line => ({
  itemId: line.itemId===undefined || line.itemId===null || line.itemId==='' ? null : toNum(line.itemId, null),
  name: String(line.name||line.itemName||'').trim(),
  category: String(line.category||'').trim(),
  qty: Math.max(0, toNum(line.qty, 0)),
  unit: String(line.unit||'').trim(),
  // Data lama tanpa alokasi lot dianggap keluar dari stok tanpa lot
  alloc: Array.isArray(line.alloc) && line.alloc.length
    ? line.alloc.map(a => ({lot:String(a.lot||'').trim(), exp:normDate(a.exp)||'', qty:Math.max(0, toNum(a.qty,0))}))
    : [{lot:'', exp:'', qty:Math.max(0, toNum(line.qty, 0))}]
});
const normalizeOpLine = line => ({
  itemId: line.itemId===undefined || line.itemId===null || line.itemId==='' ? null : toNum(line.itemId, null),
  itemName: String(line.itemName||line.name||'').trim(),
  category: String(line.category||'').trim(),
  unit: String(line.unit||'').trim(),
  systemStock: Math.max(0, toNum(line.systemStock, 0)),
  actualStock: Math.max(0, toNum(line.actualStock, 0)),
  diff: toNum(line.diff, toNum(line.actualStock, 0) - toNum(line.systemStock, 0)),
  lot: String(line.lot||'').trim(),
  lotMode: ['total','none','lot'].includes(line.lotMode) ? line.lotMode : (line.lot ? 'lot' : 'total'),
  exp: normDate(line.exp)||''
});

const normalizeInRec = arr => (Array.isArray(arr)?arr:[]).map(tx => {
  if (Array.isArray(tx.lines)) {
    return {
      id: toNum(tx.id, nextId()),
      date: tx.date || today(),
      supplier: String(tx.supplier||'').trim(),
      note: String(tx.note||'').trim(),
      lines: tx.lines.map(normalizeInLine).filter(line => line.name && line.qty>0)
    };
  }
  const line = normalizeInLine(tx||{});
  return {
    id: toNum(tx&&tx.id, nextId()),
    date: tx&&tx.date ? tx.date : today(),
    supplier: String(tx&&tx.supplier||'').trim(),
    note: String(tx&&tx.note||'').trim(),
    lines: line.name && line.qty>0 ? [line] : []
  };
}).filter(tx => tx.lines.length).sort((a,b)=>b.id-a.id);

const normalizeOutRec = arr => (Array.isArray(arr)?arr:[]).map(tx => {
  if (Array.isArray(tx.lines)) {
    return {
      id: toNum(tx.id, nextId()),
      date: tx.date || today(),
      recipient: String(tx.recipient||'').trim(),
      note: String(tx.note||'').trim(),
      lines: tx.lines.map(normalizeOutLine).filter(line => line.name && line.qty>0)
    };
  }
  const line = normalizeOutLine(tx||{});
  return {
    id: toNum(tx&&tx.id, nextId()),
    date: tx&&tx.date ? tx.date : today(),
    recipient: String(tx&&tx.recipient||'').trim(),
    note: String(tx&&tx.note||'').trim(),
    lines: line.name && line.qty>0 ? [line] : []
  };
}).filter(tx => tx.lines.length).sort((a,b)=>b.id-a.id);

const normalizeOpRec = arr => (Array.isArray(arr)?arr:[]).map(tx => {
  if (Array.isArray(tx.lines)) {
    return {
      id: toNum(tx.id, nextId()),
      date: tx.date || today(),
      reason: String(tx.reason||'').trim(),
      note: String(tx.note||'').trim(),
      lines: tx.lines.map(normalizeOpLine).filter(line => line.itemName)
    };
  }
  const line = normalizeOpLine(tx||{});
  return {
    id: toNum(tx&&tx.id, nextId()),
    date: tx&&tx.date ? tx.date : today(),
    reason: String(tx&&tx.reason||'').trim(),
    note: String(tx&&tx.note||'').trim(),
    lines: line.itemName ? [line] : []
  };
}).filter(tx => tx.lines.length).sort((a,b)=>b.id-a.id);

const normalizeState = () => {
  cats = uniqText(cats);
  units = uniqText(units);
  recipients = uniqText(recipients);
  items = normalizeItems(items);
  inRec = normalizeInRec(inRec);
  outRec = normalizeOutRec(outRec);
  opRec = normalizeOpRec(opRec);
  seq = Math.max(seq, ...items.map(i=>i.id||0), ...inRec.map(r=>r.id||0), ...outRec.map(r=>r.id||0), ...opRec.map(r=>r.id||0), ...actLog.map(r=>toNum(r.id,0)));
};

const getInLines = () => inRec.flatMap(tx => (tx.lines||[]).map((line, idx) => ({...line, batchId:tx.id, lineId:`${tx.id}-in-${idx}`, date:tx.date, supplier:tx.supplier||'', note:tx.note||''})));
const getOutLines = () => outRec.flatMap(tx => (tx.lines||[]).map((line, idx) => ({...line, batchId:tx.id, lineId:`${tx.id}-out-${idx}`, date:tx.date, recipient:tx.recipient||'', note:tx.note||''})));
const getOpLines = () => opRec.flatMap(tx => (tx.lines||[]).map((line, idx) => ({...line, batchId:tx.id, lineId:`${tx.id}-op-${idx}`, date:tx.date, reason:tx.reason||'', note:tx.note||''})));
const getSupplierList = () => uniqText(inRec.map(tx => tx.supplier).filter(Boolean));
const getRecipientList = () => uniqText([...(Array.isArray(recipients)?recipients:[]), ...outRec.map(tx => tx.recipient).filter(Boolean)]);

const newInRow = () => ({ rowId: nextId(), itemId:'', newName:'', newCode:'', newBrand:'', newPermit:'', category:cats[0]||'', unit:units[0]||'', qty:'', price:'', lot:'', exp:'' });

const newOpRow = () => ({ rowId: nextId(), itemId:'', lot:'', actualStock:'' });

const resetDraftOut = () => { draftOut = { date:today(), recipientSelect:'', newRecipient:'', note:'', rows:[newOutRow()] }; };

// ── Pengingat Backup ───────────────────────────────────────────
const hasData = () => items.length || inRec.length || outRec.length || opRec.length;
const lastBackupAt = () => lg(LS.lastBackup, null);
const daysSinceBackup = () => { const t=lastBackupAt(); return t ? Math.floor((Date.now()-new Date(t).getTime())/86400000) : null; };
const backupBanner = () => {
  if (!hasData() || !settings.backupRemindDays) return '';
  const snooze = lg(LS.backupSnooze, null);
  if (snooze && Date.now() < snooze) return '';
  const d = daysSinceBackup();
  if (d!==null && d < settings.backupRemindDays) return '';
  const danger = d===null || d >= settings.backupRemindDays*2;
  const msg = d===null
    ? '<strong>Data stok belum pernah di-backup.</strong> Semua data hanya tersimpan di browser ini — jika cache browser dihapus atau komputer rusak, data bisa hilang.'
    : `<strong>Backup terakhir ${d} hari lalu</strong> (${new Date(lastBackupAt()).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}). Disarankan backup setiap ${settings.backupRemindDays} hari.`;
  return `<div class="backup-banner no-print ${danger?'danger':''}">
    <span style="font-size:22px">💾</span>
    <div class="bb-text">${msg}</div>
    <button class="bb-go" onclick="exportData('json')">Backup Sekarang (JSON)</button>
    <button class="bb-later" onclick="snoozeBackup()">Ingatkan besok</button>
  </div>`;
};
const snoozeBackup = () => { ls(LS.backupSnooze, Date.now()+86400000); syncAllDrafts(); render(); };
const renderBackupInfo = () => {
  const el = document.getElementById('backupInfo');
  if (!el) return;
  const t = lastBackupAt();
  el.textContent = t ? `💾 Backup terakhir: ${new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}` : '💾 Belum pernah backup';
};

const submitIn = () => {
  syncDraftInFromDom();
  const supplier = draftIn.supplierSelect==='__new__' ? draftIn.newSupplier.trim() : draftIn.supplierSelect.trim();
  if (draftIn.supplierSelect==='__new__' && !supplier) return toast('Nama supplier wajib diisi!','err');
  if (!draftIn.rows.length) return toast('Tambahkan minimal 1 baris barang!','err');
  let nextItems = items.map(i => ({...i, lots:(i.lots||[]).map(l=>({...l}))}));
  const lines = [];
  try {
    for (const row of draftIn.rows) {
      const qty = toNum(row.qty, 0);
      const price = row.price==='' ? null : Number(row.price);
      const lot = String(row.lot||'').trim();
      const exp = String(row.exp||'').trim();
      if (!row.itemId) throw new Error('Semua baris wajib memilih barang!');
      if (!qty || qty<=0) throw new Error('Jumlah di setiap baris harus lebih dari 0!');
      if (price!==null && (!Number.isFinite(price) || price<0)) throw new Error('Harga tidak valid!');
      if (exp && !lot) throw new Error('Tanggal kedaluwarsa diisi tapi No. Lot kosong. Isi No. Lot / Batch-nya.');
      let idx;
      if (row.itemId==='__new__') {
        const name = row.newName.trim();
        const category = row.category;
        const unit = row.unit;
        if (!name || !category || !unit) throw new Error('Barang baru wajib punya nama, kategori, dan satuan!');
        const code = String(row.newCode||'').trim();
        if (code && nextItems.some(i => (i.code||'').toLowerCase()===code.toLowerCase())) throw new Error(`Kode barang "${code}" sudah dipakai barang lain.`);
        idx = nextItems.findIndex(i => i.name.toLowerCase()===name.toLowerCase() && i.category.toLowerCase()===category.toLowerCase() && i.unit.toLowerCase()===unit.toLowerCase());
        if (idx===-1) {
          idx = nextItems.push({id:nextId(), name, category, stock:0, unit, minStock:10, price:0,
            code, brand:String(row.newBrand||'').trim(), permitNo:String(row.newPermit||'').trim(), lots:[]}) - 1;
        }
      } else {
        idx = nextItems.findIndex(i => i.id===Number(row.itemId));
        if (idx===-1) throw new Error('Ada barang yang tidak ditemukan di sistem!');
      }
      const it = nextItems[idx];
      const finalPrice = price===null ? (it.price||0) : price;
      addToLot(it, lot, exp, qty);
      it.price = finalPrice;
      const storedExp = lot ? ((it.lots.find(l=>l.lot.toLowerCase()===lot.toLowerCase())||{}).exp || exp) : '';
      lines.push({itemId:it.id, name:it.name, category:it.category, qty, unit:it.unit, price:finalPrice, lot, exp:storedExp});
    }
  } catch (err) {
    return toast(err.message,'err');
  }
  items = nextItems;
  inRec.unshift({id:nextId(), date:draftIn.date||today(), supplier, note:draftIn.note.trim(), lines});
  save();
  resetDraftIn();
  toast(`Transaksi barang masuk tersimpan (${lines.length} produk).`);
  render();
};

const submitOpname = () => {
  syncDraftOpFromDom();
  if (!draftOp.reason.trim()) return toast('Alasan opname wajib diisi!','err');
  if (!draftOp.rows.length) return toast('Tambahkan minimal 1 item opname!','err');
  const seen = new Set();
  let nextItems = items.map(i => ({...i, lots:(i.lots||[]).map(l=>({...l}))}));
  const lines = [];
  for (const row of draftOp.rows) {
    const actualStock = row.actualStock==='' ? NaN : Number(row.actualStock);
    const lotSel = row.lot || '';
    if (!row.itemId) return toast('Semua baris opname wajib memilih barang!','err');
    const key = `${row.itemId}|${lotSel}`;
    if (seen.has(key)) return toast('Satu barang/lot tidak boleh diinput dua kali dalam sesi opname!','err');
    if (lotSel==='' && [...seen].some(k=>k.startsWith(`${row.itemId}|`)) || lotSel!=='' && seen.has(`${row.itemId}|`))
      return toast('Untuk satu barang, pilih opname "Total barang" atau per lot — jangan dicampur dalam satu sesi.','err');
    seen.add(key);
    if (!Number.isFinite(actualStock) || actualStock<0) return toast('Stok fisik harus 0 atau lebih!','err');
    const idx = nextItems.findIndex(i => i.id===Number(row.itemId));
    if (idx===-1) return toast('Ada barang opname yang tidak ditemukan!','err');
    const it = nextItems[idx];
    const lotObj = (it.lots||[]).find(l=>l.lot===lotSel);
    let systemStock;
    try { systemStock = applyOpname(it, actualStock, lotSel); }
    catch (err) { return toast(err.message,'err'); }
    lines.push({
      itemId: it.id,
      itemName: it.name,
      category: it.category,
      unit: it.unit,
      systemStock,
      actualStock,
      diff: actualStock - systemStock,
      lot: lotSel===NO_LOT ? '' : lotSel,
      lotMode: lotSel===NO_LOT ? 'none' : lotSel ? 'lot' : 'total',
      exp: lotObj ? lotObj.exp : ''
    });
  }
  items = nextItems;
  opRec.unshift({id:nextId(), date:draftOp.date||today(), reason:draftOp.reason.trim(), note:draftOp.note.trim(), lines});
  lines.forEach(line => actLog.unshift({
    id: nextId(),
    ts: new Date().toISOString(),
    type: 'opname',
    itemId: line.itemId,
    itemName: line.itemName,
    systemStock: line.systemStock,
    actualStock: line.actualStock,
    diff: line.diff,
    unit: line.unit,
    lot: line.lot,
    reason: draftOp.reason.trim(),
    note: draftOp.note.trim()
  }));
  save();
  resetDraftOp();
  toast(`Sesi stok opname tersimpan (${lines.length} item).`);
  render();
};

// Mutasi satu barang (opsional: satu lot). lotFilter: '' = semua, NO_LOT = stok tanpa lot, atau kode lot.
const buildMovements = (it, lotFilter) => {
  const mv = [];
  const pick = l => !lotFilter ? true : lotFilter===NO_LOT ? !l : l===lotFilter;
  getInLines().filter(r=>r.itemId===it.id && pick(r.lot)).forEach(r => mv.push({
    date:r.date, sort:r.batchId, ref:`IN-${r.batchId}`, type:'Masuk', desc:r.supplier||'', note:r.note,
    lot:r.lot, exp:r.exp, qtyIn:r.qty, qtyOut:0
  }));
  getOutLines().filter(r=>r.itemId===it.id).forEach(r => {
    const parts = (r.alloc||[]).filter(a=>pick(a.lot));
    const qty = parts.reduce((s,a)=>s+a.qty,0);
    if (!qty) return;
    mv.push({date:r.date, sort:r.batchId, ref:`OUT-${r.batchId}`, type:'Keluar', desc:r.recipient||'', note:r.note,
      lot:parts.map(a=>a.lot||'(tanpa lot)').join(', '), exp:'', qtyIn:0, qtyOut:qty});
  });
  getOpLines().filter(r=>r.itemId===it.id).forEach(r => {
    const affects = !lotFilter ? true : lotFilter===NO_LOT ? r.lotMode!=='lot' : (r.lotMode==='lot' && r.lot===lotFilter);
    if (!affects || !r.diff) return;
    mv.push({date:r.date, sort:r.batchId, ref:`OP-${r.batchId}`, type:'Opname', desc:r.reason||'', note:r.note,
      lot: r.lotMode==='lot' ? r.lot : r.lotMode==='none' ? '(tanpa lot)' : '', exp:r.exp||'', qtyIn:Math.max(0,r.diff), qtyOut:Math.max(0,-r.diff)});
  });
  // Koreksi manual stok lewat Edit Barang (stok tanpa lot)
  if (!lotFilter || lotFilter===NO_LOT) {
    actLog.filter(a=>a.type==='edit').forEach(a => {
      let before = a.stockBefore, after = a.stockAfter;
      if (a.itemId!==undefined && a.itemId!==it.id) return;
      if (a.itemId===undefined) {
        // Data lama: cocokkan dengan nama dan baca perubahan "Stok: x → y"
        if (a.itemName!==it.name) return;
        const m = (a.changes||[]).map(c=>/^Stok: (-?[\d.]+) → (-?[\d.]+)$/.exec(c)).find(Boolean);
        if (!m) return;
        before = Number(m[1]); after = Number(m[2]);
      }
      if (before===undefined || after===undefined || before===after) return;
      const d = after - before;
      mv.push({date:localISO(new Date(a.ts)), sort:toNum(a.id,0), ref:'EDIT', type:'Koreksi', desc:a.reason||'', note:a.note,
        lot:'', exp:'', qtyIn:Math.max(0,d), qtyOut:Math.max(0,-d)});
    });
  }
  return mv.sort((a,b)=>a.date.localeCompare(b.date) || a.sort-b.sort);
};

const kartuData = () => {
  const it = items.find(i=>String(i.id)===String(kartu.itemId));
  if (!it) return null;
  const lotFilter = kartu.lot;
  const current = !lotFilter ? it.stock : lotFilter===NO_LOT ? unlotted(it) : ((it.lots||[]).find(l=>l.lot===lotFilter)||{qty:0}).qty;
  const all = buildMovements(it, lotFilter);
  const net = all.reduce((s,m)=>s+m.qtyIn-m.qtyOut,0);
  let bal = current - net; // saldo sebelum transaksi pertama tercatat
  const from = kartu.from, to = kartu.to;
  all.filter(m => from && m.date < from).forEach(m => { bal += m.qtyIn - m.qtyOut; });
  const opening = bal;
  const rows = all.filter(m => (!from || m.date>=from) && (!to || m.date<=to)).map(m => {
    bal += m.qtyIn - m.qtyOut;
    return {...m, balance: bal};
  });
  const totIn = rows.reduce((s,r)=>s+r.qtyIn,0), totOut = rows.reduce((s,r)=>s+r.qtyOut,0);
  const lotObj = lotFilter && lotFilter!==NO_LOT ? (it.lots||[]).find(l=>l.lot===lotFilter) : null;
  const lotExpFromHist = lotFilter && lotFilter!==NO_LOT && !lotObj ? (all.find(m=>m.exp)||{}).exp : '';
  return {it, rows, opening, closing: opening + totIn - totOut, totIn, totOut, lotObj, lotExp: lotObj ? lotObj.exp : lotExpFromHist};
};

const kartuLotOptions = it => {
  if (!it) return '<option value="">Semua lot</option>';
  const known = new Map();
  (it.lots||[]).forEach(l => known.set(l.lot, l.exp));
  getInLines().filter(r=>r.itemId===it.id && r.lot).forEach(r => { if (!known.has(r.lot)) known.set(r.lot, r.exp); });
  const lots = sortLots([...known.entries()].map(([lot,exp])=>({lot,exp})));
  return `<option value="">Semua lot (total barang)</option>`
    + lots.map(l=>`<option value="${escAttr(l.lot)}" ${kartu.lot===l.lot?'selected':''}>${esc(lotText(l))}${(it.lots||[]).some(x=>x.lot===l.lot)?'':' · habis'}</option>`).join('')
    + `<option value="${NO_LOT}" ${kartu.lot===NO_LOT?'selected':''}>Tanpa lot</option>`;
};

  const rows = [

    [],
    [B('Nama Barang'), it.name, '', B('Kode Barang'), it.code||''],
    [B('Merek'), it.brand||'', '', B('No. Izin Edar'), it.permitNo||''],
    [B('Kategori'), it.category, '', B('Satuan'), it.unit],
    [B('Lot'), kartuLotLabel(d), '', B('Periode'), kartuPeriodLabel()],
    [],
    ['Tanggal','No. Transaksi','Jenis','Keterangan','Catatan','Lot','Masuk','Keluar','Saldo'].map(B),

    ...d.rows.map(r => [r.date, r.ref, r.type, r.desc, r.note||'', r.lot||'', r.qtyIn||'', r.qtyOut||'', r.balance]),
    [B('Total'), '', '', '', '', '', B(d.totIn), B(d.totOut), B(d.closing)],
  ];
  const safe = s => String(s||'').replace(/[^\w\-]+/g,'_').slice(0,40);
  downloadXlsx(`kartu_stok_${safe(it.code||it.name)}_${today()}.xlsx`, 'Kartu Stok', rows, [14,18,12,28,24,16,10,10,10]);

};
